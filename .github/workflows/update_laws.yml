name: 법령 일일 업데이트

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 자정 KST (= 15:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "full=전체재수집 / update=변경분만"
        required: true
        default: "update"
        type: choice
        options:
          - update
          - full

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 전체 수집 (full)
        if: ${{ inputs.mode == 'full' }}
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: python scripts/fetch_all.py

      - name: 증분 업데이트 (update / schedule)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'update' }}
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: python scripts/fetch_all.py --update

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 법령자료/ 판례자료/ law_manifest.json update_log.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "chore: 법령 자동 업데이트 ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
