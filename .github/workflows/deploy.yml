name: Cloudflare Pages 배포

on:
  push:
    branches: [main]
    paths-ignore:
      - "법령자료/**"
      - "판례자료/**"
      - "법인세자료/**"
      - "scripts/**"
      - "update_log.md"
      - "law_manifest.json"

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 143f2323446f7c53f496c331d3f6ebd2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wrangler 설치
        run: npm install -g wrangler@latest

      - name: 배포 파일 확인
        run: |
          echo "=== 배포 디렉토리 파일 ==="
          ls -la
          echo "=== functions 폴더 ==="
          find functions -type f | sort
          echo "=== wrangler 버전 ==="
          wrangler --version

      - name: Cloudflare Pages 배포
        run: |
          wrangler pages deploy . \
            --project-name=taxist \
            --branch=main \
            --commit-dirty=true
