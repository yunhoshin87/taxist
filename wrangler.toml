# Cloudflare Pages 배포 설정.
# `wrangler pages deploy` 또는 GitHub Actions(.github/workflows/deploy.yml)가
# 이 파일을 읽어 빌드 산출물 위치와 D1 바인딩을 구성한다.

name = "taxist"
# Pages가 정적 자산으로 서빙할 빌드 출력 디렉터리(루트의 HTML/admin 등이
# 빌드 과정에서 이 폴더로 복사된다). functions/ 디렉터리는 이 설정과 별도로
# Cloudflare Pages Functions 컨벤션에 따라 자동으로 인식되어 라우팅된다.
pages_build_output_dir = "dist_deploy"
compatibility_date = "2024-09-23"
# nodejs_compat: functions/ 코드가 일부 Node.js 호환 API를 쓸 수 있게 하는
# 플래그. 다만 jsonwebtoken/bcrypt 같은 네이티브 의존 패키지는 여전히 못 쓰므로
# auth.js는 Web Crypto API로 JWT/비밀번호 해시를 직접 구현해 사용한다.
compatibility_flags = ["nodejs_compat"]

# D1 데이터베이스 바인딩 — functions/ 코드에서는 env.DB로 접근한다.
# database_id는 `wrangler d1 create taxist-db` 실행 후 채워주세요
[[d1_databases]]
binding = "DB"
database_name = "taxist-db"
database_id = "f257e814-b8ff-4ba3-a45b-55981035b44a"
