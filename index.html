<!--
  TAXIST 로그인 페이지 (index.html)
  - 세무행정 AI 질의응답 서비스 TAXIST의 첫 진입점 화면.
  - 프레임워크 없는 순수 HTML + 인라인 <style>/<script>로 작성된 Cloudflare Pages 정적 페이지.
  - 구조: <head> 안에 디자인 토큰(CSS 변수)과 컴포넌트 스타일 정의 →
    <body>에 헤더(로고/가입 링크) → 로그인 카드(폼) → 하단 안내문 →
    로그인 처리/자동 리다이렉트를 담당하는 <script>.
  - 백엔드 연동: /api/auth/login 에 fetch로 이메일/비밀번호를 POST하고,
    응답으로 받은 토큰·사용자 정보를 localStorage(taxist_token, taxist_user)에 저장.
    role(admin/일반회원)에 따라 이동할 페이지가 분기됨.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAXIST — 세무공무원을 위한 AI 질의응답</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:       #1B2B4B;
      --brand-dark:  #0F1E35;
      --brand-mid:   #2E4370;
      --blue:        #1563FF;
      --blue-dark:   #0F45B4;
      --blue-light:  #E8F0FF;
      --neutral-0:   #FFFFFF;
      --neutral-50:  #FAFAFA;
      --neutral-100: #F5F5F5;
      --neutral-200: #E8E8E8;
      --neutral-300: #CCCCCC;
      --neutral-400: #999999;
      --neutral-600: #555555;
      --neutral-700: #3B3B3B;
      --neutral-900: #1A1A1A;
      --error:       #C82B2B;
      --error-light: #FEF2F2;
      --error-border:#FECACA;
      --font: 'Inter', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      --radius:    5px;
      --radius-md: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--neutral-100);
      color: var(--neutral-900);
      min-height: 100vh;
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER ── */
    header {
      background: var(--neutral-0);
      border-bottom: 1px solid var(--neutral-200);
      padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.15rem; font-weight: 800;
      color: var(--brand); letter-spacing: -.04em;
    }
    .logo-dot { color: var(--blue); }
    .header-link { font-size: .82rem; color: var(--neutral-400); }
    .header-link a { color: var(--blue); font-weight: 600; }
    .header-link a:hover { color: var(--blue-dark); }

    /* ── MAIN ── */
    main {
      flex: 1; display: flex;
      align-items: center; justify-content: center;
      padding: 48px 24px;
    }

    /* ── CARD ── */
    .card {
      background: var(--neutral-0);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius-md);
      padding: 48px 44px;
      width: 100%; max-width: 440px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .card-brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px;
    }
    .card-brand-icon {
      width: 36px; height: 36px;
      background: var(--brand);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .9rem; font-weight: 800;
    }
    .card-brand-name {
      font-size: .9rem; font-weight: 700;
      color: var(--brand);
    }
    .card-title {
      font-size: 1.35rem; font-weight: 800;
      color: var(--neutral-900);
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: .84rem; color: var(--neutral-400);
      margin-bottom: 32px; line-height: 1.5;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: .78rem; font-weight: 600;
      color: var(--neutral-700); margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--neutral-300);
      border-radius: var(--radius);
      font-size: .9rem; font-family: var(--font);
      color: var(--neutral-900);
      background: var(--neutral-0);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-group input:hover { border-color: var(--neutral-400); }
    .form-group input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,99,255,.12);
    }
    .form-group input::placeholder { color: var(--neutral-300); }

    .form-options {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .remember {
      display: flex; align-items: center; gap: 7px;
      font-size: .8rem; color: var(--neutral-400); cursor: pointer;
    }
    .remember input[type=checkbox] { accent-color: var(--blue); }
    .forgot { font-size: .8rem; color: var(--blue); font-weight: 600; }
    .forgot:hover { color: var(--blue-dark); }

    .btn-submit {
      width: 100%; padding: 11px;
      background: var(--brand); color: #fff;
      border: 1px solid var(--brand);
      border-radius: var(--radius); font-size: .9rem; font-weight: 700;
      font-family: var(--font); cursor: pointer;
      transition: all .15s;
    }
    .btn-submit:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-submit:disabled {
      background: var(--neutral-200); border-color: var(--neutral-200);
      color: var(--neutral-400); cursor: not-allowed;
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--neutral-200);
    }
    .divider span { font-size: .75rem; color: var(--neutral-400); white-space: nowrap; }

    .signup-link {
      text-align: center; font-size: .84rem; color: var(--neutral-400);
    }
    .signup-link a { color: var(--blue); font-weight: 600; }
    .signup-link a:hover { color: var(--blue-dark); }

    .notice {
      margin-top: 20px; padding: 10px 14px;
      background: var(--neutral-50);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius);
      font-size: .76rem; color: var(--neutral-400);
      line-height: 1.55; text-align: center;
    }

    .alert {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: .82rem; margin-bottom: 16px;
      display: none; line-height: 1.5;
    }
    .alert.error {
      background: var(--error-light);
      border: 1px solid var(--error-border);
      color: var(--error);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      main { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<!-- 헤더: 로그인 페이지 전용이라 네비게이션 없이 로고 + 가입 유도 링크만 노출 -->
<header>
  <a href="index.html" class="logo">TAXIST<span class="logo-dot">.</span></a>
  <span class="header-link">계정이 없으신가요? <a href="signup.html">무료 가입하기</a></span>
</header>

<!-- 화면 중앙에 로그인 카드를 배치하는 컨테이너 -->
<main>
  <div class="card">
    <div class="card-brand">
      <div class="card-brand-icon">T</div>
      <span class="card-brand-name">TAXIST</span>
    </div>

    <h1 class="card-title">로그인</h1>
    <p class="card-sub">아이디와 비밀번호를 입력해 주세요.<br>관리자·일반 회원 구분 없이 동일한 로그인 화면을 사용합니다.</p>

    <!-- 로그인 실패/서버 오류 시 메시지를 표시하는 영역. 기본은 display:none, JS에서 토글 -->
    <div class="alert error" id="alertBox"></div>

    <!-- 관리자/일반회원 구분 없이 동일한 폼을 사용하고, 분기는 서버 응답의 role로 처리 -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">아이디</label>
        <input type="text" id="email" name="email"
               placeholder="아이디를 입력하세요" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password"
               placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember" /> 로그인 유지
        </label>
        <a href="#" class="forgot">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">로그인</button>
    </form>

    <div class="divider"><span>또는</span></div>

    <p class="signup-link">
      아직 계정이 없으신가요? <a href="signup.html">무료로 시작하기 →</a>
    </p>

    <div class="notice">
      로그인 후 권한에 따라 자동으로 이동합니다.<br>
      일반 회원 → 질문 작성 화면 &nbsp;|&nbsp; 관리자 → 관리자 대시보드
    </div>
  </div>
</main>

<script>
  /* 이미 로그인된 경우 바로 이동 */
  /* 토큰과 사용자 정보가 둘 다 남아있어야 유효한 세션으로 간주 (토큰만 있고 user가 없거나 반대인 비정상 상태는 무시하고 로그인 폼을 그대로 노출) */
  const _existing = JSON.parse(localStorage.getItem('taxist_user') || 'null');
  if (_existing && localStorage.getItem('taxist_token')) {
    window.location.replace(_existing.role === 'admin' ? 'admin/dashboard.html' : 'ask.html');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    // 재시도 시 이전 에러 메시지가 남아있지 않도록 매 제출마다 초기화하고, 중복 클릭 방지를 위해 버튼을 비활성화
    alertBox.style.display = 'none';
    btn.textContent = '로그인 중...';
    btn.disabled = true;

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      // 서버가 4xx/5xx로 응답한 경우(아이디·비밀번호 불일치, 비활성 계정 등). 서버가 내려준 메시지를 우선 사용하고 없으면 기본 문구로 대체
      if (!res.ok) {
        alertBox.textContent = data.error || '로그인에 실패했습니다.';
        alertBox.style.display = 'block';
        btn.textContent = '로그인';
        btn.disabled = false;
        return;
      }

      // 다른 페이지(ask.html, admin/dashboard.html 등)에서도 재사용할 수 있도록 토큰·사용자 정보를 localStorage에 저장
      localStorage.setItem('taxist_token', data.token);
      localStorage.setItem('taxist_user', JSON.stringify(data.user));

      // role에 따라 이동 경로와 함께, 각 영역(admin/ask)에서 참조하는 자체 플래그(adminAuth/userAuth)도 같이 세팅
      if (data.user.role === 'admin') {
        localStorage.setItem('adminAuth', 'true');
        localStorage.setItem('adminName', data.user.name);
        window.location.href = 'admin/dashboard.html';
      } else {
        localStorage.setItem('userAuth', 'true');
        localStorage.setItem('userName', data.user.name);
        window.location.href = 'ask.html';
      }
    } catch {
      // fetch 자체가 실패(네트워크 단절, CORS 등)한 경우 — res.ok 분기와 별도로 처리해 사용자에게 다른 메시지를 보여줌
      alertBox.textContent = '서버 연결에 실패했습니다.';
      alertBox.style.display = 'block';
      btn.textContent = '로그인';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
