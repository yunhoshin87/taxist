<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공유된 검토보고서 — TAXIST</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #1B2B4B; --brand-mid: #2E4370; --blue: #1563FF;
      --neutral-0: #FFFFFF; --neutral-50: #FAFAFA; --neutral-100: #F4F5F7;
      --neutral-200: #E8E8E8; --neutral-300: #CCCCCC; --neutral-400: #999;
      --neutral-600: #555; --neutral-700: #3B3B3B; --neutral-900: #1A1A1A;
      --success: #0D7F3F; --success-light: #E6F6EE; --success-border: #86EFAC;
      --font: 'Inter', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      --radius: 5px; --radius-md: 8px; --radius-lg: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--neutral-100); color: var(--neutral-900); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    nav {
      background: var(--neutral-0); border-bottom: 1px solid var(--neutral-200);
      padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.15rem; font-weight: 800; color: var(--brand); letter-spacing: -.04em; text-decoration: none; }
    .logo-dot { color: var(--blue); }
    .share-badge {
      font-size: .75rem; font-weight: 600; padding: 4px 12px; border-radius: 100px;
      background: var(--success-light); color: var(--success); border: 1px solid var(--success-border);
    }
    .page { max-width: 960px; margin: 32px auto; padding: 0 24px 60px; }
    .meta-bar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .meta-tax { font-size: .75rem; font-weight: 700; padding: 4px 12px; border-radius: 100px; background: #E8F0FF; color: var(--blue); }
    .meta-title { font-size: 1.1rem; font-weight: 700; color: var(--brand); flex: 1; }
    .meta-date { font-size: .78rem; color: var(--neutral-400); }
    .ans-card {
      background: var(--neutral-0); border: 1px solid var(--neutral-200); border-radius: var(--radius-lg); overflow: hidden;
    }
    .ans-head {
      background: var(--brand); padding: 14px 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .ans-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; }
    .ans-head-title { font-size: .82rem; font-weight: 600; color: rgba(255,255,255,.9); }
    .ans-tax-tag {
      font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 100px;
      background: rgba(255,255,255,.15); color: rgba(255,255,255,.85); margin-left: auto;
    }
    .ans-body {
      padding: 32px 36px; font-size: .9rem; line-height: 1.9; color: var(--neutral-900);
    }
    .rpt-section { margin-bottom: 32px; }
    .rpt-section:last-of-type { margin-bottom: 0; }
    .rpt-h { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--brand); }
    .rpt-h-text { font-size: .95rem; font-weight: 800; color: var(--brand); }
    .rpt-h3 { margin: 20px 0 10px; padding: 9px 14px; background: var(--neutral-50); border-left: 3px solid var(--brand-mid); border-radius: 0 var(--radius) var(--radius) 0; }
    .rpt-h3-text { font-size: .875rem; font-weight: 800; color: var(--brand-mid); }
    .rpt-body p { margin: 0 0 10px; }
    .rpt-body p:last-child { margin: 0; }
    .rpt-subh { font-size: .8rem; font-weight: 800; color: var(--brand-mid); display: block; margin: 16px 0 7px; padding-left: 10px; border-left: 3px solid var(--blue); }
    .rpt-cite { background: var(--neutral-50); border-left: 3px solid var(--neutral-300); padding: 10px 14px; margin: 8px 0 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: .84rem; color: var(--neutral-600); line-height: 1.7; }
    .rpt-interp { border: 1px solid var(--neutral-200); border-radius: var(--radius-md); padding: 14px 18px; margin: 10px 0 12px; }
    .rpt-interp-title { font-size: .82rem; font-weight: 800; color: var(--brand); margin-bottom: 5px; }
    .rpt-interp-basis { font-size: .74rem; color: var(--neutral-400); background: var(--neutral-100); border-radius: var(--radius); padding: 3px 8px; display: inline-block; margin-bottom: 8px; }
    .rpt-interp-body { font-size: .875rem; line-height: 1.75; }
    .rpt-list { list-style: none; padding: 0; margin: 8px 0; }
    .rpt-list li { padding: 3px 0 3px 16px; position: relative; font-size: .875rem; }
    .rpt-list li::before { content: "–"; position: absolute; left: 3px; color: var(--blue); font-weight: 700; }
    .rpt-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .82rem; }
    .rpt-table th { background: var(--brand); color: #fff; padding: 9px 13px; text-align: left; font-size: .78rem; font-weight: 600; }
    .rpt-table td { padding: 9px 13px; border-bottom: 1px solid var(--neutral-200); vertical-align: top; line-height: 1.6; }
    .rpt-table td:first-child { font-weight: 600; color: var(--brand-mid); white-space: nowrap; }
    .warning-box { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: var(--radius-md); padding: 12px 16px; font-size: .8rem; color: #78350F; line-height: 1.6; margin-top: 20px; }
    .footer-bar {
      padding: 14px 22px; border-top: 1px solid var(--neutral-200); background: var(--neutral-50);
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .sources-label { font-size: .75rem; color: var(--neutral-400); }
    .source-chip {
      font-size: .72rem; padding: 3px 9px; border-radius: 100px;
      background: #E8F0FF; color: var(--blue); display: inline-block; margin: 2px 3px 2px 0;
    }
    .print-btn {
      padding: 8px 18px; border-radius: var(--radius-md); background: var(--brand); color: #fff;
      border: none; font-size: .82rem; font-weight: 700; cursor: pointer;
    }
    .print-btn:hover { background: #0F1E35; }
    .error-box { text-align: center; padding: 80px 20px; color: var(--neutral-400); }
    .error-icon { font-size: 2.5rem; margin-bottom: 16px; }
    .law-link { color: var(--blue); text-decoration: none; border-bottom: 1px dotted var(--blue); }
    .law-link:hover { opacity: .75; }
    @media print {
      nav, .meta-bar, .footer-bar { display: none !important; }
      body { background: #fff; }
      .ans-card { border: none; border-radius: 0; }
      .ans-head { background: #1B2B4B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .ans-body { padding: 20px 0; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">TAXIST<span class="logo-dot">.</span></a>
  <span class="share-badge">공유된 보고서</span>
</nav>

<div class="page" id="page" style="display:none">
  <div class="meta-bar">
    <span class="meta-tax" id="metaTax"></span>
    <span class="meta-title" id="metaTitle"></span>
    <span class="meta-date" id="metaDate"></span>
  </div>
  <div class="ans-card">
    <div class="ans-head">
      <div class="ans-dot"></div>
      <span class="ans-head-title">AI 검토 보고서</span>
      <span class="ans-tax-tag" id="ansTaxTag"></span>
    </div>
    <div class="ans-body" id="ansBody"></div>
    <div class="footer-bar">
      <div>
        <div class="sources-label">참고자료</div>
        <div id="sourcesEl"></div>
      </div>
      <button class="print-btn" onclick="window.print()">PDF / 인쇄</button>
    </div>
  </div>
</div>

<div class="error-box" id="errorBox" style="display:none">
  <div class="error-icon">🔗</div>
  <p id="errorMsg" style="font-weight:600;color:var(--neutral-700)"></p>
  <p style="margin-top:8px;font-size:.82rem">공유 링크가 유효하지 않거나 만료됐습니다.</p>
</div>

<script>
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineFmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code style="background:#F4F5F7;padding:1px 5px;border-radius:3px;font-size:.85em">$1</code>')
    .replace(/「([^」]+)」/g, (_, n) =>
      `<a class="law-link" href="https://www.law.go.kr/법령/${encodeURIComponent(n)}" target="_blank" rel="noopener">「${esc(n)}」</a>`
    );
}
function linkifyLaws(html) {
  const linkStyle = 'color:var(--primary);text-decoration:underline;text-decoration-color:var(--primary-light);text-underline-offset:2px;font-weight:600';
  const linkIcon  = '<span style="font-size:.75em">↗</span>';

  // 「법령명」 뒤에 "제N조(의M)?"가 바로 이어지면 해당 조문 페이지로, 없으면 법령 본문으로 링크
  html = html.replace(/「([^」]+)」(\s*제\s*\d+\s*조(?:의\s*\d+)?)?/g, (_, name, art) => {
    let url = `https://www.law.go.kr/법령/${encodeURIComponent(name)}`;
    let label = `「${name}」`;
    if (art) {
      url += `/${encodeURIComponent(art.replace(/\s+/g, ''))}`;
      label += art;
    }
    return `<a href="${url}" target="_blank" rel="noopener" title="법령 원문 보기" style="${linkStyle}">${label}${linkIcon}</a>`;
  });

  // 법원 판례 사건번호(예: 2020두12345) → law.go.kr 판례 검색으로 링크.
  // 서면질의/조심결정 등 문서번호는 고유 ID 없이는 정확한 딥링크가 불가능해 대상에서 제외.
  html = html.replace(/\b(19|20)\d{2}[가-힣]{1,2}\d{2,6}\b/g, (caseNo) => {
    const url = `https://www.law.go.kr/precSc.do?query=${encodeURIComponent(caseNo)}`;
    return `<a href="${url}" target="_blank" rel="noopener" title="판례 검색 보기" style="${linkStyle}">${caseNo}${linkIcon}</a>`;
  });

  return html;
}
function buildSourceUrl(name) {
  const caseMatch = name.match(/\b(19|20)\d{2}[가-힣]{1,2}\d{2,6}\b/);
  if (caseMatch) return `https://www.law.go.kr/precSc.do?query=${encodeURIComponent(caseMatch[0])}`;
  const lawMatch = name.match(/「([^」]+)」/);
  if (lawMatch) return `https://www.law.go.kr/법령/${encodeURIComponent(lawMatch[1])}`;
  return 'https://taxlaw.nts.go.kr/qt/USEQTA001L.do?ntstDcmClCd=02';
}
function linkifySourceRefs(html, sources) {
  if (!sources || !sources.length) return html;
  return html.replace(/\[자료\s*(\d+)\]/g, (full, n) => {
    const i = Number(n);
    if (i < 1 || i > sources.length) return full;
    return `<a href="#src-ref-${i}" title="${esc(sources[i - 1])}" style="color:var(--primary);font-weight:600;text-decoration:underline">[자료 ${i}]</a>`;
  });
}
function renderReport(md) {
  const lines = md.split('\n'); let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.match(/^##\s+/) && !line.match(/^###/)) {
      const title = line.replace(/^##\s+/,'').trim();
      html += `<div class="rpt-section"><div class="rpt-h"><span class="rpt-h-text">${esc(title)}</span></div><div class="rpt-body">`;
      i++; let body = '';
      while (i < lines.length) {
        if (lines[i].match(/^##\s+/) && !lines[i].match(/^###/)) break;
        body += lines[i] + '\n'; i++;
      }
      html += renderSectionBody(body); html += '</div></div>'; continue;
    }
    if (/^---+$/.test(line.trim())) { html += '<hr style="margin:24px 0;border:none;border-top:1px solid var(--neutral-200)">'; i++; continue; }
    if (line.trim()) html += `<p style="margin:0 0 9px">${inlineFmt(line)}</p>`;
    i++;
  }
  return html;
}
function renderSectionBody(text) {
  let html = ''; const lines = text.split('\n'); let i = 0, tableRows = [], listItems = [];
  function flushTable() {
    if (!tableRows.length) return;
    let t = '<table class="rpt-table">';
    tableRows.forEach((row,idx) => {
      const cells = row.split('|').slice(1,-1);
      if (idx===0) t += '<thead><tr>' + cells.map(c=>`<th>${esc(c.trim())}</th>`).join('') + '</tr></thead><tbody>';
      else t += '<tr>' + cells.map(c=>`<td>${inlineFmt(c.trim())}</td>`).join('') + '</tr>';
    });
    t += '</tbody></table>'; html += t; tableRows = [];
  }
  function flushList() {
    if (!listItems.length) return;
    html += '<ul class="rpt-list">' + listItems.map(li=>`<li>${inlineFmt(li)}</li>`).join('') + '</ul>';
    listItems = [];
  }
  while (i < lines.length) {
    const line = lines[i], trimmed = line.trim();
    const h3m = trimmed.match(/^###\s+(.+)$/);
    if (h3m) { flushTable(); flushList(); html += `<div class="rpt-h3"><span class="rpt-h3-text">${esc(h3m[1])}</span></div>`; i++; continue; }
    const subhm = trimmed.match(/^\*\*\[(.+?)\]\*\*$/);
    if (subhm) { flushTable(); flushList(); html += `<span class="rpt-subh">${esc(subhm[1])}</span>`; i++; continue; }
    const interpm = trimmed.match(/^\*\*\[해석\s*(\d+)\]\s*(.+?)\*\*$/);
    if (interpm) {
      flushTable(); flushList();
      let basis = '', body2 = '', j = i + 1;
      if (j < lines.length && lines[j].trim().startsWith('> 근거:')) { basis = lines[j].trim().replace(/^>\s*근거:\s*/,''); j++; }
      while (j < lines.length && !lines[j].match(/^\*\*\[해석\s*\d+\]/)) { body2 += lines[j] + '\n'; j++; }
      html += `<div class="rpt-interp"><div class="rpt-interp-title">해석 ${interpm[1]}. ${esc(interpm[2])}</div>${basis?`<div class="rpt-interp-basis">근거: ${esc(basis)}</div>`:''}<div class="rpt-interp-body">${inlineFmt(body2.trim())}</div></div>`;
      i = j; continue;
    }
    if (trimmed.startsWith('> ')) { flushTable(); flushList(); html += `<div class="rpt-cite">${inlineFmt(trimmed.slice(2))}</div>`; i++; continue; }
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) { flushList(); if (/^[\s|:-]+$/.test(trimmed)) { i++; continue; } tableRows.push(trimmed); i++; continue; }
    const lim = trimmed.match(/^[-•]\s+(.+)/);
    if (lim) { flushTable(); listItems.push(lim[1]); i++; continue; }
    flushTable(); flushList();
    if (trimmed) html += `<p style="margin:0 0 9px">${inlineFmt(trimmed)}</p>`;
    i++;
  }
  flushTable(); flushList(); return html;
}

(async () => {
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('errorMsg').textContent = '공유 토큰이 없습니다.';
    document.getElementById('errorBox').style.display = '';
    return;
  }

  try {
    const res  = await fetch(`/api/share?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');

    document.title = `${data.title || '검토보고서'} — TAXIST`;
    document.getElementById('metaTax').textContent   = data.tax_category || '';
    document.getElementById('metaTitle').textContent = data.title || '세무행정 검토보고서';
    document.getElementById('metaDate').textContent  = data.created_at ? new Date(data.created_at).toLocaleDateString('ko-KR') + ' 작성' : '';
    document.getElementById('ansTaxTag').textContent = data.tax_category || '';

    const parts  = data.content.split(/^---\s*\n※/m);
    const body   = parts[0];
    const note   = parts[1] ? '※' + parts[1].trim() : '';
    let ansHtml = linkifyLaws(renderReport(body)) +
      (note
        ? `<div class="warning-box">⚠️ ${note}</div>`
        : `<div class="warning-box">⚠️ 본 보고서는 AI가 등록된 참고자료에 근거하여 생성한 참고용 검토 의견입니다.</div>`);
    ansHtml = linkifySourceRefs(ansHtml, data.sources || []);
    document.getElementById('ansBody').innerHTML = ansHtml;

    const sourcesEl = document.getElementById('sourcesEl');
    if (data.sources?.length) {
      sourcesEl.innerHTML = data.sources.map((s, i) =>
        `<a class="source-chip" id="src-ref-${i + 1}" href="${buildSourceUrl(s)}" target="_blank" rel="noopener">📄 [자료 ${i + 1}] ${esc(s)}</a>`
      ).join('');
    } else {
      sourcesEl.textContent = '정보 없음';
    }

    document.getElementById('page').style.display = '';
  } catch (e) {
    document.getElementById('errorMsg').textContent = e.message;
    document.getElementById('errorBox').style.display = '';
  }
})();
</script>
</body>
</html>
