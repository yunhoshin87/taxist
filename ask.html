<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>질문 작성 — TAXIST</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --coral:#E05B4B; --coral-dark:#C24636; --coral-light:#FFF0EE;
      --navy:#1B2B4B; --navy-mid:#2E4370;
      --bg:#F0F2F5; --bg-card:#FFFFFF;
      --text:#222831; --text-muted:#6B7280;
      --border:#E5E7EB;
      --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         background:var(--bg);color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit}

    /* ── NAV ── */
    nav{background:#fff;border-bottom:1px solid var(--border);
        position:sticky;top:0;z-index:50}
    .nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;
               height:60px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:1.25rem;font-weight:800;color:var(--navy);letter-spacing:-.04em}
    .logo span{color:var(--coral)}
    .nav-right{display:flex;align-items:center;gap:16px}
    .nav-user{font-size:.85rem;color:var(--text-muted)}
    .nav-user strong{color:var(--navy)}
    .nav-link{font-size:.82rem;font-weight:600;color:var(--text-muted);transition:color .2s}
    .nav-link:hover{color:var(--navy)}
    .btn-logout{font-size:.8rem;padding:7px 14px;border-radius:100px;
                border:1.5px solid var(--border);background:transparent;
                color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-logout:hover{border-color:var(--navy);color:var(--navy)}

    /* ── LAYOUT ── */
    .page{max-width:1200px;margin:0 auto;padding:28px 24px;
          display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    .page.answer-visible .form-col{position:sticky;top:80px}

    /* ── CARD ── */
    .card{background:var(--bg-card);border:1px solid var(--border);
          border-radius:var(--radius-md);padding:24px}
    .card+.card{margin-top:14px}
    .card-title{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:18px;
                display:flex;align-items:center;gap:8px}
    .card-title span{font-size:1.1rem}

    /* ── 세목 배지 ── */
    .tax-badge{display:inline-flex;align-items:center;padding:5px 14px;border-radius:100px;
               font-size:.82rem;font-weight:700;background:var(--coral-light);
               color:var(--coral);border:1.5px solid var(--coral)}

    /* ── 질문 유형 선택 ── */
    .type-selector{display:flex;gap:8px;margin-bottom:4px}
    .type-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);font-size:.88rem;font-weight:700;
              font-family:inherit;cursor:pointer;border:2px solid var(--border);
              background:#fff;color:var(--text-muted);transition:all .2s;text-align:center}
    .type-btn:hover{border-color:var(--navy);color:var(--navy)}
    .type-btn.active{border-color:var(--coral);background:var(--coral-light);color:var(--coral)}

    /* ── 관련세금 그리드 ── */
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field-group{display:flex;flex-direction:column;gap:5px}
    .field-group.full{grid-column:1/-1}
    .field-label{font-size:.75rem;font-weight:700;color:var(--navy)}
    .field-input{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
                 font-size:.88rem;font-family:inherit;color:var(--text);background:var(--bg);
                 transition:all .2s;width:100%}
    .field-input:focus{outline:none;border-color:var(--coral);
                       box-shadow:0 0 0 3px rgba(224,91,75,.1);background:#fff}
    .field-input::placeholder{color:#9CA3AF}
    select.field-input{cursor:pointer}
    .field-readonly{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
                    font-size:.88rem;background:#F8FAFC;color:var(--text-muted);
                    display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px}

    /* ── 에디터 ── */
    .editor-toolbar{display:flex;gap:4px;padding:8px 10px;background:var(--bg);
                    border:1.5px solid var(--border);border-radius:var(--radius-sm) var(--radius-sm) 0 0;
                    border-bottom:none;flex-wrap:wrap}
    .tb-btn{padding:4px 10px;border-radius:4px;font-size:.8rem;font-weight:700;
            background:#fff;border:1px solid var(--border);cursor:pointer;
            transition:all .15s;font-family:inherit;color:var(--text)}
    .tb-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
    .tb-sep{width:1px;background:var(--border);margin:0 4px}
    .editor{min-height:220px;padding:14px 16px;border:1.5px solid var(--border);
            border-radius:0 0 var(--radius-sm) var(--radius-sm);
            font-size:.9rem;line-height:1.75;outline:none;
            background:#fff;overflow-y:auto;max-height:360px;
            transition:border-color .2s}
    .editor:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(224,91,75,.1)}
    .editor[data-placeholder]:empty::before{content:attr(data-placeholder);color:#9CA3AF;pointer-events:none}
    .editor table{width:100%;border-collapse:collapse;margin:8px 0}
    .editor td,.editor th{border:1px solid var(--border);padding:6px 10px;font-size:.85rem}
    .editor th{background:var(--bg);font-weight:700}
    .editor-footer{display:flex;justify-content:space-between;align-items:center;
                   margin-top:6px;font-size:.76rem;color:var(--text-muted)}

    /* ── 첨부서류 ── */
    .drop-zone{border:2px dashed var(--border);border-radius:var(--radius-sm);
               padding:24px;text-align:center;cursor:pointer;transition:all .2s;
               background:#FAFAFA}
    .drop-zone:hover,.drop-zone.drag-over{border-color:var(--coral);background:var(--coral-light)}
    .drop-zone-icon{font-size:1.8rem;margin-bottom:8px}
    .drop-zone-text{font-size:.83rem;color:var(--text-muted);line-height:1.6}
    .drop-zone-text strong{color:var(--coral)}
    .file-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
    .file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;
               background:#F8FAFC;border:1px solid var(--border);border-radius:var(--radius-sm)}
    .file-icon{font-size:1rem;flex-shrink:0}
    .file-name{font-size:.82rem;font-weight:600;flex:1;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap}
    .file-size{font-size:.72rem;color:var(--text-muted);flex-shrink:0}
    .file-remove{background:none;border:none;cursor:pointer;color:var(--text-muted);
                 font-size:.9rem;padding:0 4px;transition:color .15s}
    .file-remove:hover{color:#DC2626}
    #fileInput{display:none}

    /* ── 제출 버튼 ── */
    .btn-submit{width:100%;padding:14px;border-radius:var(--radius-sm);margin-top:14px;
                background:var(--coral);color:#fff;font-size:1rem;font-weight:700;
                font-family:inherit;cursor:pointer;border:none;
                box-shadow:0 2px 12px rgba(224,91,75,.3);transition:all .2s}
    .btn-submit:hover{background:var(--coral-dark);transform:translateY(-1px)}
    .btn-submit:disabled{background:#CBD5E1;box-shadow:none;transform:none;cursor:not-allowed}

    /* ── ANSWER COL ── */
    .answer-col{display:none}
    .answer-col.visible{display:block}

    .skeleton{animation:shimmer 1.4s infinite linear;background:linear-gradient(90deg,#F3F4F6 25%,#E5E7EB 50%,#F3F4F6 75%);background-size:200% 100%;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-line{height:14px;border-radius:4px;margin-bottom:10px}

    /* ── 답변 카드 ── */
    .ans-card{background:var(--bg-card);border:1px solid var(--border);
              border-radius:var(--radius-md);overflow:hidden;margin-bottom:14px}
    .ans-header{background:var(--navy);padding:14px 20px;
                display:flex;align-items:center;justify-content:space-between;gap:10px}
    .ans-header-left{display:flex;align-items:center;gap:8px;min-width:0}
    .ans-dot{width:8px;height:8px;border-radius:50%;background:#6EE7B7;flex-shrink:0;
             animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .ans-header-title{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.85)}
    .ans-header-tag{font-size:.72rem;padding:3px 9px;border-radius:100px;flex-shrink:0;
                    background:rgba(224,91,75,.3);color:#FFA99D;font-weight:700}

    /* ── 보고서 본문 ── */
    .ans-body{padding:24px 26px;font-size:.875rem;line-height:1.85;color:var(--text)}
    .rpt-section{margin-bottom:26px}
    .rpt-section:last-of-type{margin-bottom:0}
    .rpt-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;
           padding-bottom:8px;border-bottom:2px solid var(--border)}
    .rpt-h-num{font-size:.7rem;font-weight:800;color:#fff;background:var(--navy);
               padding:2px 8px;border-radius:4px;flex-shrink:0;letter-spacing:.05em}
    .rpt-h-text{font-size:.9rem;font-weight:800;color:var(--navy)}
    .rpt-body p{margin:0 0 9px}
    .rpt-body p:last-child{margin:0}
    .rpt-subh{font-size:.81rem;font-weight:800;color:var(--navy-mid);
              margin:14px 0 6px;padding-left:9px;border-left:3px solid var(--coral);display:block}
    .rpt-cite{background:#F8FAFC;border-left:3px solid var(--navy-mid);
              padding:9px 13px;margin:6px 0 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
              font-size:.82rem;color:#4B5563;line-height:1.7}
    .rpt-interp{border:1.5px solid var(--border);border-radius:var(--radius-sm);
                padding:13px 15px;margin:8px 0 10px;background:#FAFAFA}
    .rpt-interp-title{font-size:.81rem;font-weight:800;color:var(--coral);margin-bottom:5px}
    .rpt-interp-basis{font-size:.74rem;color:var(--text-muted);
                      padding:3px 8px;background:#F0F2F5;border-radius:4px;
                      display:inline-block;margin-bottom:7px}
    .rpt-interp-body{font-size:.84rem;line-height:1.75;color:var(--text)}
    .rpt-list{list-style:none;padding:0;margin:6px 0}
    .rpt-list li{padding:3px 0 3px 16px;position:relative;font-size:.84rem}
    .rpt-list li::before{content:"•";position:absolute;left:3px;color:var(--coral);font-weight:700}
    .rpt-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.8rem}
    .rpt-table th{background:var(--navy);color:#fff;padding:8px 11px;
                  text-align:left;font-size:.76rem;font-weight:700}
    .rpt-table td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.6}
    .rpt-table tr:hover td{background:#F9FAFB}
    .rpt-table td:first-child{font-weight:600;color:var(--navy-mid);white-space:nowrap}

    /* 출처·경고 */
    .source-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .source-chip{font-size:.72rem;padding:3px 10px;border-radius:100px;
                 background:#EEF4FF;color:#3B5BDB;font-weight:600}
    .warning-box{background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--radius-sm);
                 padding:11px 14px;font-size:.78rem;color:#92400E;line-height:1.6}

    .ans-actions{display:flex;gap:10px;padding:14px 20px;
                 border-top:1px solid var(--border);background:#FAFAFA;flex-wrap:wrap}
    .act-btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:.82rem;
             font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:none}
    .act-copy{background:var(--navy);color:#fff}
    .act-copy:hover{background:var(--navy-mid)}
    .act-new{background:transparent;border:1.5px solid var(--border)!important;color:var(--text-muted)}
    .act-new:hover{border-color:var(--navy)!important;color:var(--navy)}

    /* ── 내 질문 목록 ── */
    .myq-item{display:flex;align-items:center;gap:12px;padding:12px 0;
              border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
    .myq-item:last-child{border-bottom:none}
    .myq-item:hover{padding-left:4px}
    .myq-cat{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:100px;
             background:#DBEAFE;color:#1E40AF;flex-shrink:0}
    .myq-title{font-size:.85rem;font-weight:600;flex:1;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .myq-date{font-size:.72rem;color:var(--text-muted);flex-shrink:0}

    @media(max-width:900px){
      .page{grid-template-columns:1fr}
      .page.answer-visible .form-col{position:static}
      .info-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">TAXIST<span>.</span></a>
    <div class="nav-right">
      <span class="nav-user"><strong id="navName"></strong> 님</span>
      <a href="#myq" class="nav-link">내 질문 목록</a>
      <button class="btn-logout" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
</nav>

<div class="page" id="page">

  <!-- ── 질문 작성 폼 ── -->
  <div class="form-col">

    <!-- 질문 유형 선택 -->
    <div class="card" style="padding:16px 20px">
      <div style="font-size:.78rem;font-weight:700;color:var(--navy);margin-bottom:10px">질문 유형</div>
      <div class="type-selector">
        <button class="type-btn active" id="typeBtn일반" onclick="setType('일반')">일반</button>
        <button class="type-btn" id="typeBtn고충민원" onclick="setType('고충민원')">고충민원</button>
      </div>
    </div>

    <!-- 관련세금 정보 (고충민원 전용) -->
    <div class="card" id="cardTaxInfo" style="display:none">
      <div class="card-title"><span>📋</span> 관련세금 정보</div>
      <div class="info-grid">

        <div class="field-group">
          <span class="field-label">연도기분</span>
          <select class="field-input" id="yearPeriod" onchange="checkReady()">
            <option value="">선택</option>
            <option>2025년</option>
            <option>2024년</option>
            <option>2023년</option>
            <option>2022년</option>
            <option>2021년</option>
            <option>2020년</option>
            <option>2019년</option>
          </select>
        </div>

        <div class="field-group">
          <span class="field-label">세목</span>
          <div class="field-readonly" id="taxBadges"></div>
        </div>

        <div class="field-group">
          <span class="field-label">고지세액</span>
          <input type="text" class="field-input" id="assessedAmount"
                 placeholder="예: 1,000,000" oninput="fmtAmount(this)" />
        </div>

        <div class="field-group">
          <span class="field-label">청구세액</span>
          <input type="text" class="field-input" id="claimedAmount"
                 placeholder="예: 800,000" oninput="fmtAmount(this)" />
        </div>

        <div class="field-group">
          <span class="field-label">납부기한</span>
          <input type="date" class="field-input" id="paymentDue" />
        </div>

        <div class="field-group">
          <span class="field-label">고지서 받은 날</span>
          <input type="date" class="field-input" id="noticeDate" />
        </div>

      </div>
    </div>

    <!-- 질문 내용 -->
    <div class="card">
      <div class="card-title"><span>✏️</span> 질문 내용</div>
      <div class="editor-toolbar">
        <button class="tb-btn" onclick="fmt('bold')"><b>B</b></button>
        <button class="tb-btn" onclick="fmt('italic')"><i>I</i></button>
        <button class="tb-btn" onclick="fmt('underline')"><u>U</u></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertTable()">표 삽입</button>
        <button class="tb-btn" onclick="fmt('insertUnorderedList')">• 목록</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="clearEditor()" style="color:#DC2626">초기화</button>
      </div>
      <div class="editor" id="editor" contenteditable="true"
           data-placeholder="질문 내용을 입력하세요.&#10;&#10;사실관계, 관련 법령, 쟁점 등을 구체적으로 적을수록 정확한 답변을 받을 수 있습니다."
           oninput="onEditorInput()"></div>
      <div class="editor-footer">
        <span id="charCount">0자</span>
        <span id="draftStatus"></span>
      </div>
    </div>

    <!-- 첨부서류 -->
    <div class="card">
      <div class="card-title"><span>📎</span> 첨부서류</div>
      <div class="drop-zone" id="dropZone"
           onclick="document.getElementById('fileInput').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="drop-zone-icon">📂</div>
        <div class="drop-zone-text">
          <strong>클릭</strong>하거나 파일을 여기로 끌어다 놓으세요<br>
          <span style="font-size:.75rem">PDF, 한글(HWP), Word, Excel, 이미지 등 · 파일당 최대 10MB</span>
        </div>
      </div>
      <input type="file" id="fileInput" multiple
             accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
             onchange="onFileSelect(this.files)" />
      <div class="file-list" id="fileList"></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitQuestion()" disabled>
      AI 답변 받기
    </button>

    <!-- 내 질문 목록 -->
    <div class="card" id="myq" style="margin-top:14px">
      <div class="card-title"><span>📋</span> 내 질문 목록 <span id="myqCount" style="font-size:.78rem;color:var(--text-muted);font-weight:500"></span></div>
      <div id="myqList"></div>
    </div>

  </div>

  <!-- ── 답변 영역 ── -->
  <div class="answer-col" id="answerCol">

    <div id="loadingCard" class="ans-card" style="display:none">
      <div class="ans-header">
        <div class="ans-header-left">
          <div class="ans-dot" style="background:#FDE68A"></div>
          <span class="ans-header-title">AI 답변 생성 중...</span>
        </div>
      </div>
      <div class="ans-body">
        <div style="margin-bottom:20px">
          <div class="skeleton sk-line" style="width:40%;height:11px"></div>
          <div class="skeleton sk-line" style="width:90%"></div>
          <div class="skeleton sk-line" style="width:75%"></div>
        </div>
        <div style="margin-bottom:20px">
          <div class="skeleton sk-line" style="width:35%;height:11px"></div>
          <div class="skeleton sk-line" style="width:85%"></div>
          <div class="skeleton sk-line" style="width:60%"></div>
          <div class="skeleton sk-line" style="width:78%"></div>
        </div>
        <div>
          <div class="skeleton sk-line" style="width:38%;height:11px"></div>
          <div class="skeleton sk-line" style="width:92%"></div>
          <div class="skeleton sk-line" style="width:50%"></div>
        </div>
      </div>
    </div>

    <div id="answerCard" class="ans-card" style="display:none">
      <div class="ans-header">
        <div class="ans-header-left">
          <div class="ans-dot"></div>
          <span class="ans-header-title">AI 답변 완료</span>
        </div>
        <span class="ans-header-tag" id="ansTaxTag"></span>
      </div>
      <div class="ans-body" id="ansBody"></div>
      <div class="ans-actions">
        <button class="act-btn act-copy" onclick="copyAnswer()">📋 답변 복사</button>
        <button class="act-btn act-copy" style="background:#7048E8" onclick="printAnswer()">📄 PDF 출력</button>
        <button class="act-btn act-new" onclick="newQuestion()">+ 새 질문</button>
      </div>
    </div>

  </div>
</div>

<script>
// ── 인증 체크 ──
const _token = localStorage.getItem('taxist_token');
const _user  = JSON.parse(localStorage.getItem('taxist_user') || 'null');
if (!_token || !_user) { window.location.href = 'login.html'; }
document.getElementById('navName').textContent = _user?.name || '사용자';

function doLogout() {
  localStorage.removeItem('taxist_token');
  localStorage.removeItem('taxist_user');
  localStorage.removeItem('userAuth');
  localStorage.removeItem('userName');
  window.location.href = 'index.html';
}

// ── 질문 유형 ──
let currentType = '일반';

function setType(type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('typeBtn' + type).classList.add('active');
  document.getElementById('cardTaxInfo').style.display = (type === '고충민원') ? '' : 'none';
  checkReady();
}

// ── 세목: 회원가입 시 결정된 세목 표시 ──
const _taxCategories = _user?.tax_categories || [];
const selectedTax = _taxCategories[0] || '';

(function renderTaxBadges() {
  const el = document.getElementById('taxBadges');
  if (!_taxCategories.length) {
    el.innerHTML = '<span style="font-size:.82rem;color:var(--text-muted)">세목 정보 없음</span>';
    return;
  }
  el.innerHTML = _taxCategories.map(t => `<span class="tax-badge">${t}</span>`).join('');
})();

// ── 금액 자동 포맷 (콤마) ──
function fmtAmount(el) {
  const raw = el.value.replace(/[^0-9]/g, '');
  el.value = raw ? Number(raw).toLocaleString() : '';
}

// ── 에디터 ──
function fmt(cmd) { document.execCommand(cmd, false, null); document.getElementById('editor').focus(); }
function clearEditor() {
  if (confirm('입력 내용을 모두 지우시겠습니까?')) {
    document.getElementById('editor').innerHTML = '';
    onEditorInput();
  }
}
function insertTable() {
  const html = `<table style="width:100%;border-collapse:collapse">
    <tr><th style="border:1px solid #E5E7EB;padding:6px 10px;background:#F7F5F2">항목</th><th style="border:1px solid #E5E7EB;padding:6px 10px;background:#F7F5F2">내용</th></tr>
    <tr><td style="border:1px solid #E5E7EB;padding:6px 10px">　</td><td style="border:1px solid #E5E7EB;padding:6px 10px">　</td></tr>
    <tr><td style="border:1px solid #E5E7EB;padding:6px 10px">　</td><td style="border:1px solid #E5E7EB;padding:6px 10px">　</td></tr>
  </table><p><br></p>`;
  document.execCommand('insertHTML', false, html);
}
function onEditorInput() {
  const text = document.getElementById('editor').innerText || '';
  document.getElementById('charCount').textContent = text.length.toLocaleString() + '자';
  checkReady();
  saveDraft();
}

function checkReady() {
  const hasContent = (document.getElementById('editor').innerText || '').trim().length > 10;
  const hasYear    = currentType === '고충민원'
    ? document.getElementById('yearPeriod').value !== ''
    : true;
  document.getElementById('submitBtn').disabled = !(hasYear && hasContent);
}

let draftTimer;
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    document.getElementById('draftStatus').textContent =
      '임시저장됨 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
  }, 1500);
}

// ── 첨부파일 ──
let attachedFiles = [];

function onDragOver(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.add('drag-over');
}
function onDragLeave(e) {
  document.getElementById('dropZone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag-over');
  onFileSelect(e.dataTransfer.files);
}
function onFileSelect(files) {
  const MAX = 10 * 1024 * 1024;
  Array.from(files).forEach(f => {
    if (f.size > MAX) { alert(`${f.name}\n파일 크기가 10MB를 초과합니다.`); return; }
    if (attachedFiles.some(x => x.name === f.name)) return;
    attachedFiles.push(f);
  });
  renderFileList();
  document.getElementById('fileInput').value = '';
}
function removeFile(name) {
  attachedFiles = attachedFiles.filter(f => f.name !== name);
  renderFileList();
}
function renderFileList() {
  const el = document.getElementById('fileList');
  if (!attachedFiles.length) { el.innerHTML = ''; return; }
  el.innerHTML = attachedFiles.map(f => `
    <div class="file-item">
      <span class="file-icon">${fileIcon(f.name)}</span>
      <span class="file-name">${f.name}</span>
      <span class="file-size">${fmtSize(f.size)}</span>
      <button class="file-remove" onclick="removeFile('${f.name.replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
}
function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return '📄';
  if (['hwp','hwpx'].includes(ext)) return '📝';
  if (['doc','docx'].includes(ext)) return '📃';
  if (['xls','xlsx'].includes(ext)) return '📊';
  if (['png','jpg','jpeg'].includes(ext)) return '🖼️';
  return '📎';
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

// ── 자동 제목 생성 ──
function buildTitle() {
  const tax = selectedTax || (_taxCategories.join('/') || '');
  if (currentType === '고충민원') {
    const year = document.getElementById('yearPeriod').value;
    return ['고충민원', tax, year].filter(Boolean).join(' ');
  }
  return ['일반질문', tax].filter(Boolean).join(' ') || '질문';
}

// ── 구조화 정보를 질문 컨텍스트로 변환 ──
function buildContext() {
  const files = attachedFiles.map(f => f.name).join(', ') || '없음';

  if (currentType === '고충민원') {
    const year     = document.getElementById('yearPeriod').value;
    const assessed = document.getElementById('assessedAmount').value;
    const claimed  = document.getElementById('claimedAmount').value;
    const due      = document.getElementById('paymentDue').value;
    const notice   = document.getElementById('noticeDate').value;
    const tax      = _taxCategories.join(', ') || '-';
    const rows = [
      ['질문유형', '고충민원'],
      ['세목', tax],
      ['연도기분', year || '-'],
      ['고지세액', assessed ? assessed + '원' : '-'],
      ['청구세액', claimed  ? claimed  + '원' : '-'],
      ['납부기한', due     || '-'],
      ['고지서받은날', notice  || '-'],
      ['첨부서류', files],
    ];
    return '[관련세금 정보]\n' + rows.map(([k,v]) => `• ${k}: ${v}`).join('\n') + '\n\n';
  }

  // 일반: 첨부파일 정보만 포함
  const tax = _taxCategories.join(', ') || '-';
  return `[질문유형: 일반 | 세목: ${tax}${files !== '없음' ? ' | 첨부: ' + files : ''}]\n\n`;
}

// ── 질문 이력 ──
async function renderHistory() {
  const container = document.getElementById('myqList');
  const countEl   = document.getElementById('myqCount');
  try {
    const res  = await fetch('/api/questions', { headers: { Authorization: `Bearer ${_token}` } });
    const data = await res.json();
    const list = data.questions || [];
    countEl.textContent = list.length ? `(${list.length}건)` : '';
    if (!list.length) {
      container.innerHTML = '<p style="font-size:.83rem;color:var(--text-muted);padding:12px 0">아직 질문이 없습니다.</p>';
      return;
    }
    container.innerHTML = list.slice(0, 5).map(q => `
      <div class="myq-item" onclick="loadQuestion(${q.id})">
        <span class="myq-cat">${q.tax_category}</span>
        <span class="myq-title">${q.title}</span>
        <span class="myq-date">${q.created_at?.slice(0,10)}</span>
      </div>`).join('');
  } catch {
    container.innerHTML = '<p style="font-size:.83rem;color:var(--text-muted)">이력을 불러오지 못했습니다.</p>';
  }
}
renderHistory();

async function loadQuestion(id) {
  const res  = await fetch(`/api/questions/${id}`, { headers: { Authorization: `Bearer ${_token}` } });
  const data = await res.json();
  if (!data.question) return;
  document.getElementById('editor').innerHTML = data.question.content;
  if (data.answer) {
    showAnswer(data.question.tax_category, data.answer.content, data.answer.sources || []);
    document.getElementById('page').classList.add('answer-visible');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 질문 제출 ──
async function submitQuestion() {
  const content = document.getElementById('editor').innerText.trim();
  if (!document.getElementById('yearPeriod').value || !content) return;

  const title   = buildTitle();
  const context = buildContext();
  const fullContent = context + content;

  const btn = document.getElementById('submitBtn');
  btn.textContent = 'AI 분석 중...';
  btn.disabled = true;

  document.getElementById('answerCol').classList.add('visible');
  document.getElementById('loadingCard').style.display = 'block';
  document.getElementById('answerCard').style.display  = 'none';
  document.getElementById('page').classList.add('answer-visible');

  try {
    const res  = await fetch('/api/questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ tax_category: selectedTax, title, content: fullContent }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '오류가 발생했습니다');

    document.getElementById('loadingCard').style.display = 'none';
    showAnswer(selectedTax, data.answer.content, data.answer.sources || []);
    renderHistory();
  } catch (e) {
    document.getElementById('loadingCard').style.display = 'none';
    alert('답변 생성 실패: ' + e.message);
  } finally {
    btn.textContent = 'AI 답변 받기';
    btn.disabled    = false;
  }
}

// ── 보고서 렌더러 ──
const SECTION_NUMS = { 'Ⅰ':'Ⅰ','Ⅱ':'Ⅱ','Ⅲ':'Ⅲ','Ⅳ':'Ⅳ','Ⅴ':'Ⅴ','Ⅵ':'Ⅵ','Ⅶ':'Ⅶ','Ⅷ':'Ⅷ' };

function renderReport(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inlineFmt(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code style="background:#F3F4F6;padding:1px 4px;border-radius:3px;font-size:.82em">$1</code>');
  }

  while (i < lines.length) {
    const line = lines[i];

    // 섹션 헤더: ## Ⅰ. 제목
    const secMatch = line.match(/^##\s+([ⅠⅡⅢⅣⅤⅥⅦⅧ])\.\s+(.+)$/);
    if (secMatch) {
      html += `<div class="rpt-section"><div class="rpt-h">
        <span class="rpt-h-num">${secMatch[1]}</span>
        <span class="rpt-h-text">${esc(secMatch[2])}</span>
      </div><div class="rpt-body">`;
      i++;
      // 섹션 끝까지 내용 수집
      let body = '';
      while (i < lines.length && !lines[i].match(/^##\s+[ⅠⅡⅢⅣⅤⅥⅦⅧ]\./)) {
        body += lines[i] + '\n';
        i++;
      }
      html += renderSectionBody(body);
      html += '</div></div>';
      continue;
    }

    // hr 구분선
    if (/^---+$/.test(line.trim())) { html += '<hr style="margin:20px 0;border-color:var(--border)">'; i++; continue; }

    // 그 외 텍스트
    if (line.trim()) html += `<p style="margin:0 0 8px">${inlineFmt(line)}</p>`;
    i++;
  }
  return html;
}

function renderSectionBody(text) {
  let html = '';
  const lines = text.split('\n');
  let i = 0;
  let tableRows = [];
  let tableHeader = false;
  let listItems = [];

  function flushTable() {
    if (!tableRows.length) return;
    let t = '<table class="rpt-table">';
    tableRows.forEach((row, idx) => {
      const cells = row.split('|').slice(1,-1);
      if (idx === 0) {
        t += '<thead><tr>' + cells.map(c=>`<th>${esc(c.trim())}</th>`).join('') + '</tr></thead><tbody>';
      } else {
        t += '<tr>' + cells.map(c=>`<td>${inlineFmt(c.trim())}</td>`).join('') + '</tr>';
      }
    });
    t += '</tbody></table>';
    html += t;
    tableRows = [];
  }
  function flushList() {
    if (!listItems.length) return;
    html += '<ul class="rpt-list">' + listItems.map(li=>`<li>${inlineFmt(li)}</li>`).join('') + '</ul>';
    listItems = [];
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inlineFmt(s){
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code style="background:#F3F4F6;padding:1px 4px;border-radius:3px;font-size:.82em">$1</code>');
  }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // 소제목 **[항목]**
    const subhMatch = trimmed.match(/^\*\*\[(.+?)\]\*\*$/);
    if (subhMatch) {
      flushTable(); flushList();
      html += `<span class="rpt-subh">${esc(subhMatch[1])}</span>`;
      i++; continue;
    }

    // 해석 가능성 블록: **[해석 N] 제목**
    const interpMatch = trimmed.match(/^\*\*\[해석\s*(\d+)\]\s*(.+?)\*\*$/);
    if (interpMatch) {
      flushTable(); flushList();
      // 다음 줄에서 > 근거: 읽기
      let basis = '', body2 = '';
      let j = i + 1;
      if (j < lines.length && lines[j].trim().startsWith('> 근거:')) {
        basis = lines[j].trim().replace(/^>\s*근거:\s*/, '');
        j++;
      }
      while (j < lines.length && !lines[j].match(/^\*\*\[해석\s*\d+\]/)) {
        body2 += lines[j] + '\n';
        j++;
      }
      html += `<div class="rpt-interp">
        <div class="rpt-interp-title">해석 ${interpMatch[1]}. ${esc(interpMatch[2])}</div>
        ${basis ? `<div class="rpt-interp-basis">근거: ${esc(basis)}</div>` : ''}
        <div class="rpt-interp-body">${inlineFmt(body2.trim())}</div>
      </div>`;
      i = j; continue;
    }

    // 인용블록 > 텍스트
    if (trimmed.startsWith('> ')) {
      flushTable(); flushList();
      html += `<div class="rpt-cite">${inlineFmt(trimmed.slice(2))}</div>`;
      i++; continue;
    }

    // 테이블 행
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      flushList();
      if (/^[\s|:-]+$/.test(trimmed)) { i++; continue; } // 구분행 스킵
      tableRows.push(trimmed);
      i++; continue;
    }

    // 목록 - 항목
    const liMatch = trimmed.match(/^[-•]\s+(.+)/);
    if (liMatch) {
      flushTable();
      listItems.push(liMatch[1]);
      i++; continue;
    }

    // 일반 텍스트
    flushTable(); flushList();
    if (trimmed) html += `<p style="margin:0 0 8px">${inlineFmt(trimmed)}</p>`;
    i++;
  }
  flushTable(); flushList();
  return html;
}

function showAnswer(tax, mdContent, sources) {
  document.getElementById('ansTaxTag').textContent = tax;

  // ※ 면책 문구 분리
  const parts = mdContent.split(/^---\s*\n※/m);
  const body  = parts[0];
  const note  = parts[1] ? '※' + parts[1].trim() : '';

  document.getElementById('ansBody').innerHTML =
    renderReport(body) +
    (sources.length ? `
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <div style="font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--coral);margin-bottom:8px">근거 자료</div>
        <div class="source-row">${sources.map(s=>`<span class="source-chip">📄 ${s}</span>`).join('')}</div>
      </div>` : '') +
    (note ? `<div class="warning-box" style="margin-top:14px">⚠️ ${note}</div>` :
      `<div class="warning-box" style="margin-top:14px">⚠️ 본 검토 보고서는 AI가 생성한 참고용 의견입니다. 최종 법적 판단의 책임은 담당자에게 있습니다.</div>`);

  document.getElementById('answerCard').style.display = 'block';
}

function copyAnswer() {
  const text = document.getElementById('ansBody').innerText;
  navigator.clipboard.writeText(text).then(() => alert('답변이 클립보드에 복사되었습니다.'));
}
function printAnswer() { window.print(); }

function newQuestion() {
  document.getElementById('editor').innerHTML = '';
  document.getElementById('yearPeriod').value    = '';
  document.getElementById('assessedAmount').value = '';
  document.getElementById('claimedAmount').value  = '';
  document.getElementById('paymentDue').value     = '';
  document.getElementById('noticeDate').value     = '';
  setType('일반');
  attachedFiles = [];
  renderFileList();
  document.getElementById('answerCard').style.display = 'none';
  document.getElementById('answerCol').classList.remove('visible');
  document.getElementById('page').classList.remove('answer-visible');
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('charCount').textContent = '0자';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
