<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — TAXIST</title>
  <style>
    :root {
      --coral: #E05B4B; --coral-dark: #C24636; --coral-light: #FFF0EE;
      --navy: #1B2B4B; --navy-mid: #2E4370;
      --bg: #F7F5F2; --bg-card: #FFFFFF;
      --text: #222831; --text-muted: #6B7280;
      --border: #E5E7EB;
      --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px;
      --shadow-md: 0 4px 20px rgba(0,0,0,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh;
           display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* layout */
    .page { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }

    /* left panel */
    .panel-left {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      padding: 60px 64px; position: relative; overflow: hidden;
    }
    .panel-left::before {
      content: ''; position: absolute; bottom: -80px; right: -80px;
      width: 320px; height: 320px; border-radius: 50%;
      background: rgba(224,91,75,.2);
    }
    .panel-left::after {
      content: ''; position: absolute; top: -60px; left: -60px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,.04);
    }
    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -.04em;
            margin-bottom: 48px; position: relative; z-index: 1; }
    .logo span { color: var(--coral); }
    .panel-left h2 { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1.3;
                     margin-bottom: 20px; position: relative; z-index: 1; }
    .panel-left h2 em { color: var(--coral); font-style: normal; }
    .panel-left p { color: rgba(255,255,255,.6); font-size: .95rem; line-height: 1.75;
                    max-width: 340px; position: relative; z-index: 1; }
    .panel-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px;
                   position: relative; z-index: 1; }
    .chip { font-size: .78rem; font-weight: 600; padding: 6px 14px; border-radius: 100px;
            background: rgba(255,255,255,.1); color: rgba(255,255,255,.75);
            border: 1px solid rgba(255,255,255,.15); }

    /* right panel */
    .panel-right {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 60px 48px; background: #fff;
    }
    .form-box { width: 100%; max-width: 400px; }
    .form-box h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em;
                   margin-bottom: 8px; }
    .form-box .sub { font-size: .9rem; color: var(--text-muted); margin-bottom: 36px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: .82rem; font-weight: 600;
                        color: var(--navy); margin-bottom: 7px; }
    .form-group input {
      width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: .92rem; font-family: inherit;
      background: var(--bg); color: var(--text); transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus {
      outline: none; border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(224,91,75,.12);
      background: #fff;
    }
    .form-options { display: flex; justify-content: space-between; align-items: center;
                    margin-bottom: 24px; }
    .remember { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--text-muted); cursor: pointer; }
    .remember input { width: auto; }
    .forgot { font-size: .82rem; color: var(--coral); font-weight: 600; }
    .forgot:hover { color: var(--coral-dark); }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: var(--radius-sm);
      background: var(--coral); color: #fff; font-size: 1rem; font-weight: 700;
      font-family: inherit; cursor: pointer; border: none;
      box-shadow: 0 2px 10px rgba(224,91,75,.3);
      transition: all .2s;
    }
    .btn-submit:hover { background: var(--coral-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(224,91,75,.4); }

    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--border); }
    .divider span { font-size: .78rem; color: var(--text-muted); }

    .signup-link { text-align: center; font-size: .88rem; color: var(--text-muted); }
    .signup-link a { color: var(--coral); font-weight: 700; }
    .signup-link a:hover { color: var(--coral-dark); }

    .alert {
      padding: 12px 16px; border-radius: var(--radius-sm); font-size: .84rem;
      margin-bottom: 20px; display: none;
    }
    .alert.error { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
    .alert.info  { background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; }

    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 40px 24px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="panel-left">
    <a href="index.html" class="logo">TAXI<span>ST</span></a>
    <h2>세무행정 질의에<br><em>AI 답변</em>을<br>즉시 받으세요</h2>
    <p>법령·판례·조례·내부 자료를 근거로 한 실무 검토 의견을 5분 안에 받아보세요.</p>
    <div class="panel-chips">
      <span class="chip">법인세</span>
      <span class="chip">부가세</span>
      <span class="chip">조사</span>
      <span class="chip">징세</span>
      <span class="chip">재산세</span>
      <span class="chip">개인세</span>
    </div>
  </div>
  <div class="panel-right">
    <div class="form-box">
      <h1>다시 오셨군요 👋</h1>
      <p class="sub">이메일과 비밀번호로 로그인하세요.</p>

      <div class="alert error" id="alertBox">이메일 또는 비밀번호가 올바르지 않습니다.</div>
      <div class="alert info" id="infoBox"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="name@organization.go.kr" required />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호 입력" required />
        </div>
        <div class="form-options">
          <label class="remember">
            <input type="checkbox" name="remember" /> 로그인 유지
          </label>
          <a href="#" class="forgot">비밀번호 찾기</a>
        </div>
        <button type="submit" class="btn-submit">로그인</button>
      </form>

      <div class="divider"><span>또는</span></div>

      <p class="signup-link">
        아직 계정이 없으신가요? <a href="signup.html">무료로 시작하기</a>
      </p>
    </div>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = e.target.querySelector('button[type=submit]');
  btn.textContent = '로그인 중...';
  btn.disabled = true;
  // TODO: 실제 API 연동
  setTimeout(() => {
    btn.textContent = '로그인';
    btn.disabled = false;
    document.getElementById('alertBox').style.display = 'block';
  }, 1000);
}
</script>
</body>
</html>
