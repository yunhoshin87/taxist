<!--
  TAXIST 로그인 페이지 (정적 HTML, Cloudflare Pages 배포)
  - 프레임워크 없는 vanilla JS + inline <script>. 백엔드 연동은 fetch API로 직접 호출.
  - 일반 회원/관리자 구분 없이 동일한 로그인 폼을 사용하며, 로그인 성공 응답의
    user.role 값에 따라 이동할 페이지(관리자 대시보드 vs 질문 작성 화면)만 분기한다.
  - 연동 백엔드: functions/api/auth/login.js (POST /api/auth/login)
    요청 바디: { email, password } / 성공 시 { token, user } 반환
    실패 시 401(자격 불일치)·403(정지 계정)·500(서버 오류) 등 status별 error 메시지를 반환하며,
    프론트는 status 코드를 구분하지 않고 모두 동일하게 alertBox에 표시한다(메시지 텍스트만 다름).
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — TAXIST</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:       #1B2B4B;
      --brand-dark:  #0F1E35;
      --brand-mid:   #2E4370;
      --brand-light: #EEF2FF;
      --blue:        #1563FF;
      --blue-dark:   #0F45B4;
      --blue-light:  #E8F0FF;
      --neutral-0:   #FFFFFF;
      --neutral-50:  #FAFAFA;
      --neutral-100: #F5F5F5;
      --neutral-200: #E8E8E8;
      --neutral-300: #CCCCCC;
      --neutral-400: #999999;
      --neutral-600: #555555;
      --neutral-700: #3B3B3B;
      --neutral-900: #1A1A1A;
      --error:       #C82B2B;
      --error-light: #FEF2F2;
      --error-border:#FECACA;
      --font: 'Inter', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      --radius:    5px;
      --radius-md: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--neutral-100);
      color: var(--neutral-900);
      min-height: 100vh;
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER ── */
    header {
      background: var(--neutral-0);
      border-bottom: 1px solid var(--neutral-200);
      padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.15rem; font-weight: 800;
      color: var(--brand); letter-spacing: -.04em;
    }
    .logo-dot { color: var(--blue); }
    .header-link { font-size: .82rem; color: var(--neutral-400); }
    .header-link a { color: var(--blue); font-weight: 600; }
    .header-link a:hover { color: var(--blue-dark); }

    /* ── MAIN ── */
    main {
      flex: 1; display: flex;
      align-items: center; justify-content: center;
      padding: 48px 24px;
    }

    /* ── CARD ── */
    .card {
      background: var(--neutral-0);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius-md);
      padding: 48px 44px;
      width: 100%; max-width: 440px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    /* ── CARD HEADER ── */
    .card-brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px;
    }
    .card-brand-icon {
      width: 36px; height: 36px;
      background: var(--brand);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .9rem; font-weight: 800;
    }
    .card-brand-name {
      font-size: .9rem; font-weight: 700;
      color: var(--brand);
    }
    .card-title {
      font-size: 1.35rem; font-weight: 800;
      color: var(--neutral-900);
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: .84rem; color: var(--neutral-400);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: .78rem; font-weight: 600;
      color: var(--neutral-700);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--neutral-300);
      border-radius: var(--radius);
      font-size: .9rem; font-family: var(--font);
      color: var(--neutral-900);
      background: var(--neutral-0);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-group input:hover { border-color: var(--neutral-400); }
    .form-group input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,99,255,.12);
    }
    .form-group input::placeholder { color: var(--neutral-300); }

    /* ── OPTIONS ── */
    .form-options {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .remember {
      display: flex; align-items: center; gap: 7px;
      font-size: .8rem; color: var(--neutral-400); cursor: pointer;
    }
    .remember input[type=checkbox] { accent-color: var(--blue); }
    .forgot { font-size: .8rem; color: var(--blue); font-weight: 600; }
    .forgot:hover { color: var(--blue-dark); }

    /* ── SUBMIT ── */
    .btn-submit {
      width: 100%; padding: 11px;
      background: var(--brand); color: #fff;
      border: 1px solid var(--brand);
      border-radius: var(--radius); font-size: .9rem; font-weight: 700;
      font-family: var(--font); cursor: pointer;
      transition: all .15s;
    }
    .btn-submit:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-submit:disabled {
      background: var(--neutral-200); border-color: var(--neutral-200);
      color: var(--neutral-400); cursor: not-allowed;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--neutral-200);
    }
    .divider span { font-size: .75rem; color: var(--neutral-400); white-space: nowrap; }

    /* ── SIGNUP LINK ── */
    .signup-link {
      text-align: center; font-size: .84rem; color: var(--neutral-400);
    }
    .signup-link a { color: var(--blue); font-weight: 600; }
    .signup-link a:hover { color: var(--blue-dark); }

    /* ── NOTICE ── */
    .notice {
      margin-top: 20px; padding: 10px 14px;
      background: var(--neutral-50);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius);
      font-size: .76rem; color: var(--neutral-400);
      line-height: 1.55; text-align: center;
    }

    /* ── ALERT ── */
    .alert {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: .82rem; margin-bottom: 16px;
      display: none; line-height: 1.5;
    }
    .alert.error {
      background: var(--error-light);
      border: 1px solid var(--error-border);
      color: var(--error);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      main { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<!-- 상단 헤더: 로고 + 회원가입 페이지로의 진입 링크 (가입 안 한 사용자를 위한 안내) -->
<header>
  <a href="index.html" class="logo">TAXIST<span class="logo-dot">.</span></a>
  <span class="header-link">계정이 없으신가요? <a href="signup.html">무료 가입하기</a></span>
</header>

<main>
  <div class="card">
    <div class="card-brand">
      <div class="card-brand-icon">T</div>
      <span class="card-brand-name">TAXIST</span>
    </div>

    <h1 class="card-title">로그인</h1>
    <p class="card-sub">아이디와 비밀번호를 입력해 주세요.<br>관리자·일반 회원 구분 없이 동일한 로그인 화면을 사용합니다.</p>

    <!-- 로그인 실패 시 메시지를 표시하는 영역. 기본은 display:none(숨김)이며
         handleLogin()에서 에러가 발생할 때만 display:block으로 보여준다. -->
    <div class="alert error" id="alertBox"></div>

    <!-- 폼 submit(엔터 입력 포함) 시 handleLogin()이 실행되며, 내부에서
         preventDefault()로 기본 폼 전송(페이지 새로고침)을 막고 fetch로 대체한다. -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">아이디</label>
        <input type="text" id="email" name="email"
               placeholder="아이디를 입력하세요" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password"
               placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember" /> 로그인 유지
        </label>
        <a href="#" class="forgot">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">로그인</button>
    </form>

    <div class="divider"><span>또는</span></div>

    <p class="signup-link">
      아직 계정이 없으신가요? <a href="signup.html">무료로 시작하기 →</a>
    </p>

    <!-- role에 따라 이동 경로가 갈리는 것을 가입 전에 미리 안내하는 문구 -->
    <div class="notice">
      로그인 후 권한에 따라 자동으로 이동합니다.<br>
      일반 회원 → 질문 작성 화면 &nbsp;|&nbsp; 관리자 → 관리자 대시보드
    </div>
  </div>
</main>

<script>
// 로그인 폼 제출 핸들러.
// 클라이언트 단에서는 이메일/비밀번호 형식 검증을 하지 않고(input의 required만 사용),
// 실제 자격 증명 검증은 전부 서버(functions/api/auth/login.js)에 위임한다.
async function handleLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');

  // 재요청 시 이전 에러 메시지를 지우고, 중복 클릭 방지를 위해 버튼을 비활성화 + 로딩 텍스트로 변경
  alertBox.style.display = 'none';
  btn.textContent = '로그인 중...';
  btn.disabled = true;

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    // res.ok가 false인 경우(400/401/403/500 등) — 백엔드가 보낸 error 메시지를 그대로 노출.
    // 상태 코드별로 분기하지 않는 이유: login.js가 이미 "이메일 또는 비밀번호가
    // 올바르지 않습니다"(401, 미가입/오답 공통) / "이용이 정지된 계정입니다"(403) /
    // "서버 오류가 발생했습니다"(500) 등 사용자에게 보여줄 문구를 완성된 형태로 내려주므로
    // 프론트는 그대로 alertBox에 표시만 하면 된다.
    if (!res.ok) {
      alertBox.textContent = data.error || '로그인에 실패했습니다.';
      alertBox.style.display = 'block';
      btn.textContent = '로그인';
      btn.disabled = false;
      return;
    }

    // 로그인 성공 — JWT와 사용자 정보를 localStorage에 저장해 이후 페이지에서
    // Authorization 헤더 구성 및 화면 표시(이름 등)에 재사용한다.
    localStorage.setItem('taxist_token', data.token);
    localStorage.setItem('taxist_user', JSON.stringify(data.user));

    // user.role 값으로 이동 경로 분기. adminAuth/userAuth 플래그는 각 페이지에서
    // 별도의 간단한 접근 가드(로그인 여부 체크)로 사용하기 위해 함께 저장한다.
    if (data.user.role === 'admin') {
      localStorage.setItem('adminAuth', 'true');
      localStorage.setItem('adminName', data.user.name);
      window.location.href = 'admin/dashboard.html';
    } else {
      localStorage.setItem('userAuth', 'true');
      localStorage.setItem('userName', data.user.name);
      window.location.href = 'ask.html';
    }
  } catch {
    // fetch 자체가 실패(네트워크 오류 등)한 경우 — 서버가 응답을 못 준 상태이므로
    // res.ok 분기와는 별도로 고정 메시지를 보여준다.
    alertBox.textContent = '서버 연결에 실패했습니다.';
    alertBox.style.display = 'block';
    btn.textContent = '로그인';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
