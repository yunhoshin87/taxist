<!--
  admin/index.html — 관리자 로그인 페이지
  ============================================================================
  TAXIST 관리자페이지의 진입점. 일반 회원 로그인과 별도의 화면이지만 백엔드는
  동일한 /api/auth/login 엔드포인트를 공유하며, 응답으로 받은 사용자 정보의
  role이 'admin'인지를 프론트에서 추가로 확인해 관리자 전용 접근을 제한한다.
  (실제 권한 검증은 각 /api/admin/* 엔드포인트가 JWT의 role을 다시 검사하므로,
  여기서의 role 체크는 잘못된 화면 진입을 막는 UX 차원의 가드일 뿐이다.)
  로그인 성공 시 JWT를 localStorage에 저장하고 dashboard.html로 이동한다.
  -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 — TAXIST</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    :root {
      --coral:#E05B4B; --coral-dark:#C24636;
      --navy:#1B2B4B; --navy-mid:#2E4370;
      --bg:#F7F5F2; --border:#E5E7EB;
      --text:#222831; --text-muted:#6B7280;
      --radius-sm:8px; --radius-md:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         background:var(--bg);color:var(--text);min-height:100vh;
         display:flex;align-items:center;justify-content:center;}
    a{text-decoration:none;color:inherit}

    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);
          padding:48px 44px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
    .logo{font-size:1.4rem;font-weight:800;color:var(--navy);letter-spacing:-.04em;
          display:block;margin-bottom:6px}
    .logo span{color:var(--coral)}
    .admin-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;
                 border-radius:100px;background:var(--navy);color:#fff;margin-bottom:28px}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
    .sub{font-size:.85rem;color:var(--text-muted);margin-bottom:28px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin-bottom:6px}
    .form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);
                      border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;
                      background:var(--bg);transition:border-color .2s,box-shadow .2s}
    .form-group input:focus{outline:none;border-color:var(--coral);
                             box-shadow:0 0 0 3px rgba(224,91,75,.12);background:#fff}
    .btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--navy);
         color:#fff;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;
         border:none;transition:all .2s;margin-top:8px}
    .btn:hover{background:var(--navy-mid);transform:translateY(-1px)}
    .alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:.82rem;
           margin-bottom:16px;display:none;background:#FEF2F2;
           border:1px solid #FECACA;color:#991B1B}
    .hint-box{background:#F0F4FF;border:1px solid #C7D7FF;border-radius:var(--radius-sm);
              padding:12px 14px;font-size:.78rem;color:#3B5BDB;margin-top:20px;line-height:1.6}
    .back{text-align:center;margin-top:20px;font-size:.82rem;color:var(--text-muted)}
    .back a{color:var(--coral);font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <a href="../index.html" class="logo">TAXIST<span>.</span></a>
  <span class="admin-badge">관리자 전용</span>
  <h1>관리자 로그인</h1>
  <p class="sub">관리자 계정으로 로그인하세요.</p>

  <div class="alert" id="alertBox">이메일 또는 비밀번호가 올바르지 않습니다.</div>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="email" placeholder="admin@taxist.kr" required />
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="pw" placeholder="비밀번호 입력" required />
    </div>
    <button type="submit" class="btn" id="loginBtn">로그인</button>
  </form>

</div>

<script>
// 로그인 폼 submit 핸들러. 일반 회원과 동일한 /api/auth/login을 호출하는 이유는
// 백엔드에 관리자 전용 로그인 엔드포인트를 따로 두지 않고, 응답으로 내려온
// user.role 값으로 관리자 여부만 프론트에서 한 번 더 걸러내는 구조이기 때문이다.
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('loginBtn');
  const alertBox = document.getElementById('alertBox');
  // 버튼을 즉시 비활성화해 중복 클릭으로 로그인 요청이 여러 번 나가는 것을 막는다.
  btn.textContent = '로그인 중...'; btn.disabled = true;
  alertBox.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      alertBox.textContent = data.error || '로그인에 실패했습니다.';
      alertBox.style.display = 'block';
      btn.textContent = '로그인'; btn.disabled = false;
      return;
    }
    // 이메일/비밀번호는 맞지만 일반 회원 계정인 경우. 자격증명 자체는 유효하므로
    // 401이 아니라 200으로 내려오기 때문에, role을 프론트에서 별도로 검사해야 한다.
    if (data.user?.role !== 'admin') {
      alertBox.textContent = '관리자 계정이 아닙니다.';
      alertBox.style.display = 'block';
      btn.textContent = '로그인'; btn.disabled = false;
      return;
    }
    // 로그인 성공 — 이후 모든 관리자 페이지(_common.js의 api())가 이 토큰을
    // Authorization 헤더로 사용하므로 localStorage에 저장해 페이지 이동 후에도 유지한다.
    localStorage.setItem('taxist_token', data.token);
    localStorage.setItem('taxist_user', JSON.stringify(data.user));
    localStorage.setItem('adminName', data.user.name);
    window.location.href = 'dashboard.html';
  } catch {
    alertBox.textContent = '서버 연결에 실패했습니다.';
    alertBox.style.display = 'block';
    btn.textContent = '로그인'; btn.disabled = false;
  }
}
// 페이지 로드 즉시 실행되는 IIFE: 이미 유효한 관리자 토큰을 가진 상태로
// 로그인 페이지에 다시 들어온 경우(뒤로가기 등) 로그인 폼을 보여줄 필요 없이
// 곧장 대시보드로 보내준다. _common.js의 _decodeJWT/requireAdmin과 동일한 디코딩
// 로직을 사용하지만, 이 시점에는 아직 _common.js가 로드되지 않은 페이지이므로
// (로그인 페이지에는 _common.js를 포함하지 않음) 이 안에 직접 인라인되어 있다.
(function() {
  const token = localStorage.getItem('taxist_token');
  if (!token) return;
  try {
    const b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const p = JSON.parse(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)));
    if (p.role === 'admin' && p.exp > Date.now() / 1000) window.location.href = 'dashboard.html';
  } catch {}
})();
</script>
</body>
</html>
