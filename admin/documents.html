<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자료 폴더 관리 — TAXIST 관리자</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--coral:#E05B4B;--navy:#1B2B4B;--navy-mid:#2E4370;
          --bg:#F0F2F5;--bg-card:#FFFFFF;--text:#222831;--text-muted:#6B7280;
          --border:#E5E7EB;--sidebar:240px;--radius-sm:8px;--radius-md:12px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
    a{text-decoration:none;color:inherit}
    .sidebar{width:var(--sidebar);background:var(--navy);position:fixed;top:0;left:0;
             height:100vh;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
    .sb-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sb-logo a{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.04em}
    .sb-logo a span{color:var(--coral)}
    .sb-badge{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;
              border-radius:100px;background:rgba(224,91,75,.25);color:#FFA99D;margin-top:4px}
    .sb-nav{padding:16px 12px;flex:1}
    .sb-section{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
                color:rgba(255,255,255,.3);padding:8px 8px 6px;margin-top:8px}
    .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
             font-size:.88rem;font-weight:500;color:rgba(255,255,255,.65);transition:all .15s;margin-bottom:2px}
    .sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .sb-item.active{background:rgba(224,91,75,.2);color:#fff;font-weight:700}
    .sb-item.active .sb-icon{color:var(--coral)}
    .sb-icon{font-size:1rem;width:20px;text-align:center}
    .sb-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
    .sb-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--coral);
               display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
    .sb-uname{font-size:.82rem;font-weight:600;color:#fff}
    .sb-urole{font-size:.72rem;color:rgba(255,255,255,.45)}
    .btn-logout{width:100%;padding:8px;border-radius:var(--radius-sm);background:transparent;
                border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);
                font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-logout:hover{background:rgba(255,255,255,.08);color:#fff}
    .main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column}
    .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;
            height:60px;display:flex;align-items:center;justify-content:space-between;
            position:sticky;top:0;z-index:10}
    .topbar-title{font-size:1rem;font-weight:700;color:var(--navy)}
    .btn-topbar-logout{padding:6px 14px;border-radius:6px;background:transparent;
                       border:1.5px solid var(--border);color:var(--text-muted);
                       font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-topbar-logout:hover{border-color:#DC2626;color:#DC2626;background:#FEF2F2}
    .content{padding:28px;flex:1}

    /* layout */
    .doc-layout{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px}
    .card-title{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:14px;
                display:flex;align-items:center;justify-content:space-between}
    .btn-sm{padding:5px 12px;border-radius:var(--radius-sm);font-size:.76rem;font-weight:700;
            cursor:pointer;border:none;font-family:inherit;transition:all .2s}
    .btn-coral{background:var(--coral);color:#fff}
    .btn-coral:hover{background:#C24636}
    .btn-navy{background:var(--navy);color:#fff}
    .btn-navy:hover{background:var(--navy-mid)}
    .btn-outline{background:transparent;border:1.5px solid var(--border)!important;color:var(--text-muted)}
    .btn-outline:hover{border-color:var(--navy)!important;color:var(--navy)}

    /* folder tree */
    .folder-list{display:flex;flex-direction:column;gap:4px}
    .folder-item{border-radius:var(--radius-sm);overflow:hidden}
    .folder-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
                   transition:background .15s;border-radius:var(--radius-sm)}
    .folder-header:hover{background:var(--bg)}
    .folder-header.active{background:#F0F4FF}
    .folder-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .folder-name{font-size:.88rem;font-weight:700;flex:1}
    .folder-count{font-size:.72rem;color:var(--text-muted)}
    .folder-arrow{font-size:.8rem;color:var(--text-muted);transition:transform .2s}
    .folder-arrow.open{transform:rotate(90deg)}
    .subfolder-list{padding:4px 0 4px 22px;display:none}
    .subfolder-list.open{display:block}
    .subfolder-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);
                    cursor:pointer;transition:background .15s;font-size:.83rem}
    .subfolder-item:hover{background:var(--bg)}
    .subfolder-item.active{background:#FFF0EE;color:var(--coral);font-weight:600}

    /* file list */
    .file-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .file-row:last-child{border-bottom:none}
    .file-icon{font-size:1.4rem;flex-shrink:0}
    .file-name{font-size:.88rem;font-weight:600;flex:1;color:var(--text)}
    .file-meta{font-size:.74rem;color:var(--text-muted);margin-top:3px}
    .file-badges{display:flex;gap:6px;margin-top:4px}
    .fbadge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:100px}
    .fbadge-green{background:#DCFCE7;color:#166534}
    .fbadge-gray{background:#F3F4F6;color:#6B7280}
    .fbadge-orange{background:#FEF9C3;color:#854D0E}
    .file-actions{display:flex;gap:6px;flex-shrink:0}
    .fbtn{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:100px;
          cursor:pointer;border:1px solid;background:transparent;font-family:inherit;transition:all .15s}
    .fbtn-blue{border-color:#C7D7FF;color:#3B5BDB}
    .fbtn-blue:hover{background:#EEF4FF}
    .fbtn-red{border-color:#FCA5A5;color:#DC2626}
    .fbtn-red:hover{background:#FEF2F2}

    /* upload area */
    .upload-zone{border:2px dashed var(--border);border-radius:var(--radius-md);
                 padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
    .upload-zone:hover,.upload-zone.drag{border-color:var(--coral);background:#FFF0EE}
    .upload-zone p{font-size:.85rem;color:var(--text-muted);margin-top:10px}
    .upload-zone small{font-size:.76rem;color:var(--text-muted)}
    input[type=file]{display:none}

    .breadcrumb{font-size:.8rem;color:var(--text-muted);margin-bottom:14px}
    .breadcrumb strong{color:var(--navy)}
    .empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:.85rem}
    .toggle-switch{position:relative;display:inline-block;width:36px;height:20px}
    .toggle-switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:#CBD5E1;border-radius:100px;transition:.3s}
    .slider:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;
                   background:white;border-radius:50%;transition:.3s}
    input:checked+.slider{background:var(--coral)}
    input:checked+.slider:before{transform:translateX(16px)}

    /* 파일 행 체크박스 */
    .file-row{cursor:pointer;transition:background .12s}
    .file-row:hover{background:#F9FAFB}
    .file-row.selected{background:#FFF0EE}
    .file-check{width:18px;height:18px;accent-color:var(--coral);cursor:pointer;flex-shrink:0}

    /* 선택 액션바 */
    .sel-bar{display:none;align-items:center;gap:10px;padding:10px 14px;
             background:#FFF0EE;border:1px solid #FECACA;border-radius:var(--radius-sm);
             margin-bottom:12px;font-size:.83rem;color:var(--coral);font-weight:600}
    .sel-bar.visible{display:flex}
    .sel-bar-count{flex:1}
    .sel-btn{padding:5px 12px;border-radius:var(--radius-sm);font-size:.76rem;font-weight:700;
             cursor:pointer;border:none;font-family:inherit;transition:all .2s}
    .sel-btn-on{background:#10B981;color:#fff}
    .sel-btn-on:hover{background:#059669}
    .sel-btn-off{background:#6B7280;color:#fff}
    .sel-btn-off:hover{background:#4B5563}
    .sel-btn-clear{background:transparent;border:1px solid var(--coral)!important;color:var(--coral)}
    .sel-btn-clear:hover{background:#FFF0EE}

    /* 미리보기 팝업 */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
                   z-index:1000;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:var(--radius-md);width:min(860px,95vw);
           max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
           box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);
                  display:flex;align-items:center;gap:12px;flex-shrink:0}
    .modal-title{font-size:.95rem;font-weight:700;color:var(--navy);flex:1;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .modal-badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:100px;
                 background:#DBEAFE;color:#1E40AF;flex-shrink:0}
    .modal-close{background:none;border:none;cursor:pointer;font-size:1.2rem;
                 color:var(--text-muted);padding:4px;line-height:1;transition:color .15s}
    .modal-close:hover{color:#DC2626}
    .modal-body{padding:24px;overflow-y:auto;flex:1;font-size:.88rem;line-height:1.85;color:var(--text)}
    .modal-body h1{font-size:1.1rem;font-weight:800;color:var(--navy);margin:0 0 16px;
                   padding-bottom:10px;border-bottom:2px solid var(--coral)}
    .modal-body h2{font-size:.95rem;font-weight:700;color:var(--navy);margin:20px 0 8px;
                   padding-left:10px;border-left:3px solid var(--coral)}
    .modal-body h3{font-size:.88rem;font-weight:700;color:var(--navy-mid);margin:14px 0 6px}
    .modal-body h4{font-size:.84rem;font-weight:600;color:var(--text);margin:10px 0 4px}
    .modal-body p{margin:0 0 8px}
    .modal-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.82rem}
    .modal-body th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font-size:.78rem}
    .modal-body td{padding:7px 10px;border-bottom:1px solid var(--border)}
    .modal-body tr:hover td{background:#F9FAFB}
    .modal-body hr{margin:16px 0;border:none;border-top:1px solid var(--border)}
    .modal-body strong{font-weight:700}
    .modal-body blockquote{border-left:3px solid var(--border);padding-left:12px;
                           color:var(--text-muted);margin:8px 0;font-style:italic}
    .modal-body code{background:#F3F4F6;padding:1px 5px;border-radius:3px;font-size:.83rem}
    .modal-body ul,.modal-body ol{padding-left:20px;margin:6px 0}
    .modal-body li{margin-bottom:3px}
    .modal-loading{text-align:center;padding:60px;color:var(--text-muted);font-size:.9rem}
    .modal-footer{padding:12px 20px;border-top:1px solid var(--border);
                  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#FAFAFA}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-logo">
    <a href="../index.html">TAXIST<span>.</span></a>
    <div class="sb-badge">관리자 패널</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">메인</div>
    <a href="dashboard.html" class="sb-item"><span class="sb-icon">📊</span> 대시보드</a>
    <div class="sb-section">관리</div>
    <a href="members.html" class="sb-item"><span class="sb-icon">👥</span> 회원 관리</a>
    <a href="questions.html" class="sb-item"><span class="sb-icon">💬</span> 질문/답변 관리</a>
    <a href="documents.html" class="sb-item active"><span class="sb-icon">📁</span> 자료 폴더 관리</a>
    <div class="sb-section">분석</div>
    <a href="members.html#license" class="sb-item"><span class="sb-icon">🎫</span> 이용권 분석</a>
  </nav>
  <div class="sb-footer">
    <div class="sb-user">
      <div class="sb-avatar">관</div>
      <div><div class="sb-uname">관리자</div><div class="sb-urole">admin@taxist.kr</div></div>
    </div>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">자료 폴더 관리</span>
    <button class="btn-topbar-logout" onclick="logout()">로그아웃</button>
  </div>
  <div class="content">
    <div class="doc-layout">

      <!-- 폴더 트리 -->
      <div class="card">
        <div class="card-title">
          폴더 구조
          <button class="btn-sm btn-coral" onclick="alert('폴더 생성 기능은 백엔드 연동 후 활성화됩니다.')">+ 폴더</button>
        </div>
        <div class="folder-list" id="folderTree"></div>
      </div>

      <!-- 파일 목록 -->
      <div class="card">
        <div class="card-title">
          <span id="panelTitle">폴더를 선택하세요</span>
          <button class="btn-sm btn-navy" onclick="document.getElementById('fileInput').click()">📤 파일 업로드</button>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.txt" onchange="handleUpload(event)" />
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>

        <!-- 선택 액션바 -->
        <div class="sel-bar" id="selBar">
          <span class="sel-bar-count" id="selCount"></span>
          <button class="sel-btn sel-btn-on"  onclick="bulkToggle(true)">활성화</button>
          <button class="sel-btn sel-btn-off" onclick="bulkToggle(false)">비활성화</button>
          <button class="sel-btn sel-btn-clear" onclick="clearSelection()">선택 해제</button>
        </div>

        <!-- 업로드 가이드 (초기) -->
        <div id="uploadGuide">
          <div class="upload-zone" id="uploadZone"
               ondragover="event.preventDefault();this.classList.add('drag')"
               ondragleave="this.classList.remove('drag')"
               ondrop="handleDrop(event)"
               onclick="document.getElementById('fileInput').click()">
            <div style="font-size:2.5rem">📊</div>
            <p>엑셀 또는 텍스트 파일을 드래그하거나 클릭하여 업로드</p>
            <small>Excel (.xlsx, .xls) · 텍스트 (.txt) · 최대 10MB</small>
          </div>
        </div>

        <div id="fileList"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 업로드 확인 모달 ── -->
<div class="modal-overlay" id="uploadModal" onclick="closeUploadModal(event)">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <span class="modal-title">파일 업로드 확인</span>
      <button class="modal-close" onclick="document.getElementById('uploadModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="font-size:.82rem;font-weight:600;color:var(--navy);display:block;margin-bottom:6px">문서명</label>
        <input id="uploadName" type="text"
               style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
                      font-family:inherit;font-size:.88rem;outline:none;transition:border .2s"
               onfocus="this.style.borderColor='var(--coral)'" onblur="this.style.borderColor='var(--border)'" />
      </div>
      <div>
        <label style="font-size:.82rem;font-weight:600;color:var(--navy);display:block;margin-bottom:6px">세목</label>
        <select id="uploadCategory"
                style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
                       font-family:inherit;font-size:.88rem;background:#fff;outline:none;cursor:pointer">
          <option value="all">전체 (all)</option>
          <option value="법인세">법인세</option>
          <option value="부가세">부가세</option>
          <option value="개인세">개인세 (소득세)</option>
          <option value="재산세">재산세</option>
          <option value="징세">징세</option>
          <option value="조사">조사</option>
        </select>
      </div>
      <div id="uploadPreview"
           style="font-size:.76rem;color:var(--text-muted);background:var(--bg);padding:10px 12px;
                  border-radius:var(--radius-sm);line-height:1.7;white-space:pre-wrap;max-height:120px;overflow-y:auto"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-sm btn-outline" onclick="document.getElementById('uploadModal').classList.remove('open')">취소</button>
      <button class="btn-sm btn-coral" id="uploadSubmitBtn" onclick="submitUpload()">업로드</button>
    </div>
  </div>
</div>

<!-- ── 미리보기 팝업 ── -->
<div class="modal-overlay" id="previewModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <span class="modal-badge" id="modalBadge"></span>
      <button class="modal-close" onclick="document.getElementById('previewModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-loading">불러오는 중...</div>
    </div>
    <div class="modal-footer">
      <button class="btn-sm btn-outline" onclick="document.getElementById('previewModal').classList.remove('open')">닫기</button>
    </div>
  </div>
</div>

<script src="_common.js"></script>
<script>
requireAdmin();
let allFolders      = [];
let selectedFolderId = null;
let selectedDocIds   = new Set();

// ── 폴더 로드 ──
async function loadFolders() {
  try {
    const { folders } = await api('/api/admin/folders');
    allFolders = folders;
  } catch (e) {
    allFolders = [];
    console.error('폴더 로드 실패:', e);
  }
  renderTree();
  if (selectedFolderId) renderFileList(selectedFolderId);
}

// ── 폴더 트리 렌더 ──
function renderTree() {
  document.getElementById('folderTree').innerHTML = allFolders.map(f => `
    <div class="folder-item">
      <div class="folder-header ${selectedFolderId === f.id ? 'active' : ''}"
           onclick="selectFolder(${f.id})">
        <div class="folder-dot" style="background:${f.is_active ? '#10B981' : '#9CA3AF'}"></div>
        <span class="folder-name">${f.name}</span>
        <span class="folder-count">${f.documents.length}개</span>
        <label class="toggle-switch" title="폴더 활성화" onclick="event.stopPropagation()" style="margin-left:auto">
          <input type="checkbox" ${f.is_active ? 'checked' : ''} onchange="toggleFolder(${f.id},this.checked)" />
          <span class="slider"></span>
        </label>
      </div>
    </div>`).join('');
}

function selectFolder(fid) {
  selectedFolderId = fid;
  selectedDocIds.clear();
  renderTree();
  renderFileList(fid);
}

// ── 파일 목록 렌더 ──
function renderFileList(fid) {
  const folder = allFolders.find(f => f.id === fid);
  if (!folder) return;
  document.getElementById('panelTitle').textContent = folder.name;
  document.getElementById('breadcrumb').innerHTML =
    `<span>자료</span> / <strong>${folder.name}</strong>`;
  document.getElementById('uploadGuide').style.display = 'none';
  updateSelBar();

  if (!folder.documents.length) {
    document.getElementById('fileList').innerHTML =
      '<div class="empty-state">📂 이 폴더에 파일이 없습니다.</div>';
    return;
  }

  document.getElementById('fileList').innerHTML = folder.documents.map(doc => `
    <div class="file-row ${selectedDocIds.has(doc.id) ? 'selected' : ''}"
         id="row-${doc.id}" onclick="toggleSelect(event,${doc.id})">
      <input class="file-check" type="checkbox" ${selectedDocIds.has(doc.id) ? 'checked' : ''}
             onclick="event.stopPropagation();toggleSelect(event,${doc.id})" />
      <div class="file-icon">📄</div>
      <div style="flex:1;min-width:0">
        <div class="file-name">${doc.name}</div>
        <div class="file-meta">수정일 ${doc.updated_at ? doc.updated_at.split('T')[0] : '-'} · ${doc.tax_category || 'all'}</div>
        <div class="file-badges">
          ${doc.is_active
            ? '<span class="fbadge fbadge-green">답변사용중</span>'
            : '<span class="fbadge fbadge-gray">비활성</span>'}
        </div>
      </div>
      <div class="file-actions" onclick="event.stopPropagation()">
        <button class="fbtn fbtn-blue" onclick="openPreview(${doc.id},'${esc(doc.name)}','${esc(doc.tax_category||'')}')">
          미리보기
        </button>
        <label class="toggle-switch" title="답변에 사용 여부" style="margin-left:6px">
          <input type="checkbox" ${doc.is_active ? 'checked' : ''}
                 onchange="toggleDoc(${doc.id},this.checked)" />
          <span class="slider"></span>
        </label>
      </div>
    </div>`).join('');
}

function esc(s) { return String(s || '').replace(/'/g, "\\'"); }

// ── 개별 선택 ──
function toggleSelect(e, docId) {
  if (e.target.tagName === 'BUTTON' || e.target.closest('button') ||
      e.target.tagName === 'INPUT' && e.target.type === 'checkbox' &&
      !e.target.classList.contains('file-check')) return;

  if (selectedDocIds.has(docId)) selectedDocIds.delete(docId);
  else selectedDocIds.add(docId);

  const row = document.getElementById(`row-${docId}`);
  if (row) {
    row.classList.toggle('selected', selectedDocIds.has(docId));
    const cb = row.querySelector('.file-check');
    if (cb) cb.checked = selectedDocIds.has(docId);
  }
  updateSelBar();
}

function updateSelBar() {
  const bar = document.getElementById('selBar');
  const cnt = selectedDocIds.size;
  if (cnt > 0) {
    bar.classList.add('visible');
    document.getElementById('selCount').textContent = `${cnt}개 선택됨`;
  } else {
    bar.classList.remove('visible');
  }
}

function clearSelection() {
  selectedDocIds.clear();
  renderFileList(selectedFolderId);
}

// ── 일괄 활성/비활성 ──
async function bulkToggle(is_active) {
  if (!selectedDocIds.size) return;
  const ids = [...selectedDocIds];
  try {
    await Promise.all(ids.map(id =>
      api('/api/admin/folders', { method: 'POST', body: JSON.stringify({ doc_id: id, is_active }) })
    ));
    const folder = allFolders.find(f => f.id === selectedFolderId);
    if (folder) {
      folder.documents.forEach(d => {
        if (selectedDocIds.has(d.id)) d.is_active = is_active ? 1 : 0;
      });
    }
    selectedDocIds.clear();
    renderFileList(selectedFolderId);
  } catch (e) {
    alert('변경 실패: ' + e.message);
    await loadFolders();
  }
}

// ── 개별 토글 ──
async function toggleFolder(fid, is_active) {
  try {
    await api('/api/admin/folders', { method: 'PUT', body: JSON.stringify({ id: fid, is_active }) });
    await loadFolders();
  } catch (e) { alert('변경 실패: ' + e.message); }
}

async function toggleDoc(doc_id, is_active) {
  try {
    await api('/api/admin/folders', { method: 'POST', body: JSON.stringify({ doc_id, is_active }) });
    const folder = allFolders.find(f => f.id === selectedFolderId);
    if (folder) {
      const doc = folder.documents.find(d => d.id === doc_id);
      if (doc) doc.is_active = is_active ? 1 : 0;
    }
    renderFileList(selectedFolderId);
  } catch (e) {
    alert('변경 실패: ' + e.message);
    await loadFolders();
  }
}

// ── 미리보기 팝업 ──
async function openPreview(docId, name, taxCat) {
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalBadge').textContent = taxCat || 'all';
  document.getElementById('modalBody').innerHTML =
    '<div class="modal-loading">🔄 불러오는 중...</div>';
  document.getElementById('previewModal').classList.add('open');

  try {
    const { doc } = await api(`/api/admin/folders?doc_id=${docId}`);
    document.getElementById('modalBody').innerHTML = renderMd(doc.content || '(내용 없음)');
  } catch (e) {
    document.getElementById('modalBody').innerHTML =
      `<div class="modal-loading" style="color:#DC2626">불러오기 실패: ${e.message}</div>`;
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('previewModal'))
    document.getElementById('previewModal').classList.remove('open');
}

// Esc 키로 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('previewModal').classList.remove('open');
});

// ── 간이 Markdown 렌더러 ──
function renderMd(md) {
  const escaped = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  return escaped
    .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
    .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>')
    .replace(/`(.+?)`/g,       '<code>$1</code>')
    .replace(/^> (.+)$/gm,     '<blockquote>$1</blockquote>')
    .replace(/^---+$/gm,       '<hr>')
    .replace(/^\| (.+) \|$/gm, row => {
      if (/^[\s|:-]+$/.test(row)) return '';
      const cells = row.split('|').slice(1, -1)
        .map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    })
    .replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g, m => `<table>${m}</table>`)
    .replace(/^- (.+)$/gm,  '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g,     '<br>');
}

// ── 업로드 ──
let pendingUpload = null;

function handleUpload(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) processFile(file);
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}

async function processFile(file) {
  if (!selectedFolderId) { alert('먼저 폴더를 선택해주세요.'); return; }
  if (file.size > 10 * 1024 * 1024) { alert('파일 크기는 10MB 이하여야 합니다.'); return; }

  const ext = file.name.split('.').pop().toLowerCase();
  if (!['xlsx', 'xls', 'txt'].includes(ext)) {
    alert('.xlsx, .xls, .txt 파일만 업로드 가능합니다.');
    return;
  }

  try {
    let content = '';
    if (ext === 'txt') {
      content = await readAsText(file);
    } else {
      const buf = await readAsArrayBuffer(file);
      const wb = XLSX.read(buf, { type: 'array' });
      content = xlsxToText(wb);
    }

    if (!content.trim()) { alert('파일에서 텍스트를 추출할 수 없습니다.'); return; }

    pendingUpload = { name: file.name, content };
    document.getElementById('uploadName').value = file.name;
    document.getElementById('uploadCategory').value = 'all';
    document.getElementById('uploadPreview').textContent =
      `추출 텍스트: ${content.length.toLocaleString()}자\n\n미리보기:\n${content.slice(0, 300)}${content.length > 300 ? '…' : ''}`;
    document.getElementById('uploadModal').classList.add('open');
  } catch (err) {
    alert('파일 읽기 실패: ' + err.message);
  }
}

function readAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsText(file, 'UTF-8');
  });
}

function readAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(new Uint8Array(e.target.result));
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

function xlsxToText(wb) {
  const lines = [];
  wb.SheetNames.forEach(sheetName => {
    lines.push(`[${sheetName}]`);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
    rows.forEach(row => {
      const line = row.map(c => String(c ?? '')).join(' ').trim();
      if (line) lines.push(line);
    });
    lines.push('');
  });
  return lines.join('\n').trim();
}

function closeUploadModal(e) {
  if (e && e.target !== document.getElementById('uploadModal')) return;
  document.getElementById('uploadModal').classList.remove('open');
  pendingUpload = null;
}

async function submitUpload() {
  if (!pendingUpload) return;
  const name = document.getElementById('uploadName').value.trim();
  const tax_category = document.getElementById('uploadCategory').value;
  if (!name) { alert('문서명을 입력해주세요.'); return; }

  const btn = document.getElementById('uploadSubmitBtn');
  btn.disabled = true;
  btn.textContent = '업로드 중...';

  try {
    await api('/api/admin/folders', {
      method: 'PATCH',
      body: JSON.stringify({ folder_id: selectedFolderId, name, content: pendingUpload.content, tax_category })
    });
    document.getElementById('uploadModal').classList.remove('open');
    pendingUpload = null;
    await loadFolders();
    renderFileList(selectedFolderId);
  } catch (err) {
    alert('업로드 실패: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '업로드';
  }
}

loadFolders();
</script>
