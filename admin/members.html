<!--
  admin/members.html — 관리자 회원 관리 화면

  무엇을 하는 페이지인가:
    - 가입한 전체 회원 목록을 조회/검색/필터링하여 테이블로 보여준다.
    - 회원 상세 정보를 모달로 열람한다.
    - 회원의 이용 상태를 변경한다(이용 정지 ↔ 무료 이용 복구, 무료기간 연장).
    - 상단 요약 카드로 전체/무료이용중/무료만료/이용정지 인원 수를 한눈에 보여준다.

  구조:
    - 프레임워크 없는 순수 HTML + 인라인 <style> + 인라인 <script>(vanilla JS).
    - 다른 admin/*.html과 동일하게 _common.js를 먼저 로드해 requireAdmin/logout/api()/
      STATUS_LABEL/STATUS_COLOR 등 공통 유틸과 상태값 매핑 상수를 공유한다.
    - 데이터는 서버에서 한 번 받아 allMembers 배열에 캐시해두고, 검색창 입력이나
      세목 필터처럼 서버 재요청이 필요 없는 동작은 클라이언트에서 바로 필터링/리렌더한다
      (반면 상태 필터는 서버 쿼리 파라미터로 보내 서버 사이드에서 걸러서 받아온다).

  호출하는 백엔드 API (모두 /functions/api/admin/members 핸들러, _common.js의 api() 경유):
    - GET  /api/admin/members?q=&status=   : 검색어/상태로 필터링된 회원 목록 조회
    - PUT  /api/admin/members               : 회원 상태 변경(status) 또는 무료기간 연장(trial_ends_at)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 관리 — TAXIST 관리자</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    :root{--coral:#E05B4B;--navy:#1B2B4B;--navy-mid:#2E4370;
          --bg:#F0F2F5;--bg-card:#FFFFFF;--text:#222831;--text-muted:#6B7280;
          --border:#E5E7EB;--sidebar:240px;--radius-sm:8px;--radius-md:12px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
    a{text-decoration:none;color:inherit}
    .sidebar{width:var(--sidebar);background:var(--navy);position:fixed;top:0;left:0;
             height:100vh;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
    .sb-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sb-logo a{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.04em}
    .sb-logo a span{color:var(--coral)}
    .sb-badge{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;
              border-radius:100px;background:rgba(224,91,75,.25);color:#FFA99D;margin-top:4px}
    .sb-nav{padding:16px 12px;flex:1}
    .sb-section{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
                color:rgba(255,255,255,.3);padding:8px 8px 6px;margin-top:8px}
    .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
             font-size:.88rem;font-weight:500;color:rgba(255,255,255,.65);transition:all .15s;margin-bottom:2px}
    .sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .sb-item.active{background:rgba(224,91,75,.2);color:#fff;font-weight:700}
    .sb-item.active .sb-icon{color:var(--coral)}
    .sb-icon{font-size:1rem;width:20px;text-align:center}
    .sb-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
    .sb-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--coral);
               display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
    .sb-uname{font-size:.82rem;font-weight:600;color:#fff}
    .sb-urole{font-size:.72rem;color:rgba(255,255,255,.45)}
    .btn-logout{width:100%;padding:8px;border-radius:var(--radius-sm);background:transparent;
                border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);
                font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-logout:hover{background:rgba(255,255,255,.08);color:#fff}
    .main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column}
    .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;
            height:60px;display:flex;align-items:center;justify-content:space-between;
            position:sticky;top:0;z-index:10}
    .topbar-title{font-size:1rem;font-weight:700;color:var(--navy)}
    .btn-topbar-logout{padding:6px 14px;border-radius:6px;background:transparent;
                       border:1.5px solid var(--border);color:var(--text-muted);
                       font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-topbar-logout:hover{border-color:#DC2626;color:#DC2626;background:#FEF2F2}
    .content{padding:28px;flex:1}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:22px}
    .card+.card{margin-top:16px}
    .status{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:100px}
    .status-green{background:#DCFCE7;color:#166534}
    .status-orange{background:#FEF9C3;color:#854D0E}
    .status-red{background:#FEE2E2;color:#991B1B}
    .status-blue{background:#DBEAFE;color:#1E40AF}
    /* toolbar */
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);
                border-radius:var(--radius-sm);padding:8px 14px;flex:1;min-width:200px}
    .search-box input{border:none;outline:none;font-size:.88rem;font-family:inherit;
                      background:transparent;color:var(--text);width:100%}
    .filter-select{padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
                   font-size:.85rem;font-family:inherit;background:#fff;color:var(--text);cursor:pointer}
    /* table */
    table{width:100%;border-collapse:collapse}
    th{font-size:.76rem;font-weight:700;color:var(--text-muted);padding:10px 12px;
       text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
    td{font-size:.83rem;padding:12px 12px;border-bottom:1px solid var(--border);color:var(--text)}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#FAFAFA}
    .action-btn{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:100px;
                cursor:pointer;border:1px solid;transition:all .15s;background:transparent;font-family:inherit}
    .action-btn.view{border-color:#C7D7FF;color:#3B5BDB}
    .action-btn.view:hover{background:#EEF4FF}
    .action-btn.suspend{border-color:#FCA5A5;color:#DC2626}
    .action-btn.suspend:hover{background:#FEF2F2}
    .action-btn.restore{border-color:#86EFAC;color:#16A34A}
    .action-btn.restore:hover{background:#F0FDF4}
    .action-btn.extend{border-color:#FDE68A;color:#D97706}
    .action-btn.extend:hover{background:#FFFBEB}
    /* summary cards */
    .sum-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
    .sum-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
              padding:16px 18px}
    .sum-label{font-size:.76rem;color:var(--text-muted);margin-bottom:6px}
    .sum-val{font-size:1.5rem;font-weight:800;color:var(--navy);letter-spacing:-.03em}
    /* modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
                   display:none;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:var(--radius-md);padding:28px 28px 24px;
           width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal h3{font-size:1.1rem;font-weight:700;margin-bottom:16px}
    .modal-close{float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted)}
    .detail-row{display:flex;justify-content:space-between;padding:9px 0;
                border-bottom:1px solid var(--border);font-size:.85rem}
    .detail-row:last-child{border-bottom:none}
    .detail-label{color:var(--text-muted);font-weight:600}
    .modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
    .mbtn{padding:9px 18px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:700;
          cursor:pointer;font-family:inherit;transition:all .2s;border:none}
    .mbtn-navy{background:var(--navy);color:#fff}
    .mbtn-red{background:#FEE2E2;color:#DC2626;border:1px solid #FCA5A5}
    .mbtn-green{background:#DCFCE7;color:#166534;border:1px solid #86EFAC}
    .mbtn-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-logo">
    <a href="../index.html">TAXIST<span>.</span></a>
    <div class="sb-badge">관리자 패널</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">메인</div>
    <a href="dashboard.html" class="sb-item"><span class="sb-icon">📊</span> 대시보드</a>
    <div class="sb-section">관리</div>
    <a href="members.html" class="sb-item active"><span class="sb-icon">👥</span> 회원 관리</a>
    <a href="questions.html" class="sb-item"><span class="sb-icon">💬</span> 질문/답변 관리</a>
    <a href="documents.html" class="sb-item"><span class="sb-icon">📁</span> 자료 폴더 관리</a>
    <div class="sb-section">분석</div>
    <a href="members.html#license" class="sb-item"><span class="sb-icon">🎫</span> 이용권 분석</a>
  </nav>
  <div class="sb-footer">
    <div class="sb-user">
      <div class="sb-avatar">관</div>
      <div><div class="sb-uname">관리자</div><div class="sb-urole">admin@taxist.kr</div></div>
    </div>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">회원 관리</span>
    <button class="btn-topbar-logout" onclick="logout()">로그아웃</button>
  </div>
  <div class="content">

    <div class="sum-row" id="sumRow"></div>

    <div class="card">
      <div class="toolbar">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="이름, 이메일, 소속 검색..." oninput="onSearch()" />
        </div>
        <select class="filter-select" id="statusFilter" onchange="loadMembers()">
          <option value="">전체 상태</option>
          <option value="trial">무료사용중</option>
          <option value="expired">무료기간만료</option>
          <option value="suspended">이용정지</option>
        </select>
        <select class="filter-select" id="taxFilter" onchange="renderTable()">
          <option value="">전체 세목</option>
          <option value="법인세">법인세</option>
          <option value="소득세">소득세</option>
          <option value="부가세">부가세</option>
          <option value="원천세">원천세</option>
          <option value="종합부동산세">종합부동산세</option>
          <option value="양도소득세">양도소득세</option>
          <option value="상속세">상속세</option>
          <option value="증여세">증여세</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>이름</th><th>이메일</th><th>소속</th><th>세목</th>
            <th>가입일</th><th>무료만료일</th><th>질문수</th><th>상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="memberTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 회원 상세 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModal(null, true)">✕</button>
    <h3 id="modalTitle">회원 상세</h3>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="_common.js"></script>
<script>
// 이 페이지는 관리자 전용이므로 스크립트 실행 진입 시점에 바로 권한 검사를 한다.
// 토큰이 없거나 admin이 아니면 requireAdmin()이 즉시 로그인 페이지로 리다이렉트하므로,
// 그 아래 코드는 "여기까지 왔다면 관리자임이 보장된다"는 전제로 작성할 수 있다.
requireAdmin();
// 서버에서 받아온 회원 목록을 화면 상태로 캐시해두는 변수.
// 검색/세목 필터처럼 매 입력마다 서버에 다시 묻기엔 비효율적인 동작들은
// 이 캐시를 메모리에서 다시 필터링하는 방식으로 처리해 서버 호출 횟수를 줄인다.
let allMembers = [];

// 검색어/상태 필터를 쿼리 파라미터로 서버에 보내 회원 목록을 새로 받아온다.
// 검색(q)과 상태(status)는 둘 다 DB 조건절로 들어가야 하는 값이라 서버 사이드 필터링이 맞고,
// 반대로 세목(taxFilter)은 받아온 데이터에 이미 포함된 배열 필드라서 renderTable()에서
// 클라이언트 단에서만 거른다(서버 쿼리를 늘리지 않기 위함).
async function loadMembers() {
  const q = document.getElementById('searchInput').value;
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (status) params.set('status', status);
  try {
    const { members } = await api('/api/admin/members?' + params.toString());
    allMembers = members;
  } catch (e) {
    allMembers = [];
    console.error('회원 로드 실패:', e);
  }
  updateSummary();
  renderTable();
}

// 상단 요약 카드(전체/무료이용중/무료만료/이용정지)를 계산해 그린다.
// 별도 통계 API를 두지 않고 이미 받아온 allMembers를 순회해 집계하는 이유는,
// 이 화면이 한 번에 다루는 회원 수가 적어 클라이언트 집계로도 충분하고,
// 목록을 다시 불러올 때마다(검색/필터 변경 시) 자연스럽게 최신값으로 갱신되기 때문이다.
function updateSummary() {
  const s = { total:allMembers.length, active:0, expired:0, suspended:0 };
  allMembers.forEach(m => {
    if (m.status === 'trial') s.active++;
    else if (m.status === 'expired') s.expired++;
    else if (m.status === 'suspended') s.suspended++;
  });
  document.getElementById('sumRow').innerHTML = [
    {label:'전체 회원', val:s.total, cls:''},
    {label:'무료 이용중', val:s.active, cls:'color:#166534'},
    {label:'무료 만료', val:s.expired, cls:'color:#D97706'},
    {label:'이용 정지', val:s.suspended, cls:'color:#DC2626'},
  ].map(x=>`<div class="sum-card"><div class="sum-label">${x.label}</div>
    <div class="sum-val" style="${x.cls}">${x.val}</div></div>`).join('');
}

// 실제 테이블 렌더링. allMembers를 직접 쓰지 않고 taxFilter로 한 번 더 거른 결과(filtered)를
// 그리는 이유는, 세목 필터가 서버 요청 없이 동작해야 하므로 캐시된 전체 데이터 중
// 화면에 보여줄 부분집합만 별도로 계산하는 구조이기 때문이다.
// innerHTML을 통째로 교체하는 방식을 쓴 이유는 행 단위 DOM diff를 직접 관리하지 않아도
// 될 만큼 목록 규모가 작고, 상태 변경/검색마다 매번 전체를 다시 그려도 비용이 작기 때문이다.
function renderTable() {
  const tf = document.getElementById('taxFilter').value;
  const filtered = tf
    ? allMembers.filter(m => (m.tax_categories || []).includes(tf))
    : allMembers;
  document.getElementById('memberTbody').innerHTML = filtered.map(m => `
    <tr>
      <td><strong>${m.name}</strong></td>
      <td style="color:var(--text-muted)">${m.email}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem;color:var(--text-muted)">${m.org||''}</td>
      <td style="font-size:.76rem">${(m.tax_categories||[]).join(', ')}</td>
      <td style="color:var(--text-muted);font-size:.78rem">${m.joined_at ? m.joined_at.split('T')[0] : '-'}</td>
      <td style="font-size:.78rem${m.status==='expired'?';color:#DC2626;font-weight:700':''}">${m.trial_ends_at ? m.trial_ends_at.split('T')[0] : '-'}</td>
      <td style="font-weight:700;text-align:center">${m.question_count||0}</td>
      <td><span class="status status-${STATUS_COLOR[m.status]||'blue'}">${STATUS_LABEL[m.status]||m.status}</span></td>
      <td>
        <button class="action-btn view" onclick="openModal(${m.id})">상세</button>
        ${m.status==='suspended'
          ? `<button class="action-btn restore" onclick="changeStatus(${m.id},'trial')">복구</button>`
          : `<button class="action-btn suspend" onclick="changeStatus(${m.id},'suspended')">정지</button>`}
      </td>
    </tr>`).join('') || '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)">검색 결과 없음</td></tr>';
}

// 검색 입력에 디바운스를 거는 타이머.
// 글자 하나 입력될 때마다 서버에 요청을 보내면 타이핑 중 불필요한 호출이 쏟아지므로
// 마지막 입력 후 300ms 동안 추가 입력이 없을 때만 실제 조회를 실행한다.
let _searchTimer;
function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(loadMembers, 300);
}

// 회원의 이용 상태를 변경한다(이용 정지 또는 무료 이용 복구).
// 실수로 누른 클릭이 회원 이용권에 바로 영향을 주는 것을 막기 위해 confirm()으로
// 한 번 더 확인을 받는다. 상태 변경 후에는 화면에 캐시된 allMembers가 stale 상태이므로
// loadMembers()로 서버 데이터를 다시 받아 동기화하고, 마침 상세 모달이 열려 있다면
// 모달에 표시된 정보도 낡은 값으로 남지 않도록 openModal(id)를 다시 호출해 새로 그린다.
async function changeStatus(id, newStatus) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`${m.name} 님을 "${STATUS_LABEL[newStatus]||newStatus}"(으)로 변경하시겠습니까?`)) return;
  try {
    await api('/api/admin/members', { method:'PUT', body: JSON.stringify({ id, status: newStatus }) });
    await loadMembers();
    if (document.getElementById('modalOverlay').classList.contains('open')) openModal(id);
  } catch (e) { alert('변경 실패: ' + e.message); }
}

// 현재 모달에 표시 중인 회원 id. 모달이 열려 있는 동안 changeStatus/extendTrial이
// 끝난 뒤 같은 모달을 다시 그려야 하는데, 그 갱신 대상을 기억해두기 위한 변수다.
let currentMemberId = null;
// 회원 상세 모달을 연다. 별도의 "상세 조회" API를 호출하지 않고 이미 메모리에 있는
// allMembers에서 id로 찾아 쓰는 이유는, 목록 조회 시점에 회원의 모든 필드를 이미
// 받아왔기 때문에 같은 데이터를 다시 네트워크로 가져올 필요가 없기 때문이다.
function openModal(id) {
  currentMemberId = id;
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  document.getElementById('modalTitle').textContent = m.name + ' 님 상세';
  document.getElementById('modalContent').innerHTML = [
    ['이메일', m.email],
    ['소속', m.org || '-'],
    ['담당 세목', (m.tax_categories||[]).join(', ') || '-'],
    ['가입일', m.joined_at ? m.joined_at.split('T')[0] : '-'],
    ['무료 만료일', m.trial_ends_at ? m.trial_ends_at.split('T')[0] : '-'],
    ['이용 상태', `<span class="status status-${STATUS_COLOR[m.status]||'blue'}">${STATUS_LABEL[m.status]||m.status}</span>`],
    ['누적 질문수', (m.question_count||0) + '건'],
    ['최근 접속', m.last_login_at ? m.last_login_at.split('T')[0] : '-'],
  ].map(([l,v]) => `<div class="detail-row"><span class="detail-label">${l}</span><span>${v}</span></div>`).join('');
  document.getElementById('modalActions').innerHTML = `
    <button class="mbtn mbtn-navy" onclick="closeModal(null,true)">닫기</button>
    ${m.status==='suspended'
      ? `<button class="mbtn mbtn-green" onclick="changeStatus(${id},'trial')">이용 복구</button>`
      : `<button class="mbtn mbtn-red" onclick="changeStatus(${id},'suspended')">이용 정지</button>`}
    <button class="mbtn" style="background:#FEF9C3;color:#D97706;border:1px solid #FDE68A"
            onclick="extendTrial(${id})">무료기간 연장</button>`;
  document.getElementById('modalOverlay').classList.add('open');
}
// 모달을 닫는다. force가 true면 닫기(X) 버튼을 누른 경우이므로 무조건 닫고,
// force가 없으면 오버레이 클릭 이벤트로 들어온 경우라 클릭한 지점이 정확히
// 오버레이 배경(e.target === overlay)일 때만 닫는다 — 모달 박스 내부 클릭이
// 버블링되어 의도치 않게 모달이 닫히는 것을 막기 위함이다.
function closeModal(e, force) {
  if (force || e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}
// 무료 이용 기간을 1개월 연장한다.
// 기준일을 기존 만료일(trial_ends_at)로 잡는 이유는 "오늘부터 +1개월"이 아니라
// "원래 만료될 날로부터 +1개월"이 되어야 정상적인 연장이 되기 때문이다.
// 단, 이미 만료일이 지난 회원(base < 현재 시각)이라면 과거 날짜에 1개월을 더해도
// 의미가 없으므로 기준일을 오늘로 바꿔서 "오늘부터 +1개월"로 재설정한다.
async function extendTrial(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  const base = m.trial_ends_at ? new Date(m.trial_ends_at) : new Date();
  if (base < new Date()) base.setTime(Date.now());
  base.setMonth(base.getMonth() + 1);
  const newEnd = base.toISOString().split('T')[0];
  try {
    await api('/api/admin/members', { method:'PUT', body: JSON.stringify({ id, trial_ends_at: newEnd }) });
    alert(`${m.name} 님 무료 기간이 ${newEnd}까지 연장되었습니다.`);
    await loadMembers();
    openModal(id);
  } catch (e) { alert('연장 실패: ' + e.message); }
}

// 페이지 진입 시 최초 1회 목록을 불러와 화면을 채운다.
loadMembers();
</script>
</body>
</html>
